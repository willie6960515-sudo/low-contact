<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班級電子看板 v11.0 (完美排版與聲調鎖定版)</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <!-- 載入 pinyin-pro -->
    <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.24.2/dist/index.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        
        :root {
            --board-bg: #1a3c2b;
            --board-frame: #8d5e3c;
            --chalk-white: #f0f0f0;
            --chalk-yellow: #f1c40f;
            --chalk-shadow: 2px 2px 0px rgba(0,0,0,0.15);
            --accent-color: #f39c12; 
            --danger-color: #e74c3c;
            --nav-btn-hover: rgba(255,255,255,0.15);
            /* Font Scaling Variables */
            --left-scale: 1;
            --right-scale: 1.4;
        }

        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            color: var(--chalk-white);
            background-color: #f0f2f5;
            overflow: hidden;
        }

        /* --- UI 基礎樣式 --- */
        button { cursor: pointer; border: none; font-weight: 600; padding: 12px 20px; border-radius: 8px; transition: 0.2s; }
        .btn-primary { background: #2980b9; color: #fff; }
        .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-secondary { background: #bdc3c7; color: #2c3e50; }
        .btn-secondary:hover { background: #aab7b8; }
        .btn-edit { background: rgba(243, 156, 18, 0.1); color: #d35400; padding: 5px 10px; font-size: 0.9em; border: 1px solid #f39c12; }
        .btn-edit:hover { background: rgba(243, 156, 18, 0.2); }
        .btn-danger { background: rgba(231, 76, 60, 0.1); color: var(--danger-color); padding: 5px 10px; font-size: 0.9em; border: 1px solid var(--danger-color);}
        .btn-danger:hover { background: rgba(231, 76, 60, 0.2); }
        
        .cloud-bar { background: #fff; padding: 15px; margin-bottom: 20px; border-radius: 12px; border: 1px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .user-chip { display: flex; align-items: center; gap: 10px; color: #2c3e50; font-weight: bold; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #ccc; }
        .status-dot.online { background: #2ecc71; box-shadow: 0 0 5px #2ecc71; }
        .btn-google { background: #fff; border: 1px solid #ddd; color: #555; display: flex; align-items: center; gap: 8px; padding: 8px 16px; }
        .btn-google:hover { background: #f8f9fa; }

        .app-screen { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; overflow-y: auto; }
        .app-screen.active { display: block; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        #setup-screen { background: #f4f6f7; color: #333; }
        .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; min-height: 100vh; display: flex; flex-direction: column; justify-content: center;}
        .setup-card { background: #fff; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid #e0e0e0; position: relative; }
        .header h1 { text-align: center; color: #2c3e50; margin-bottom: 10px; font-weight: 900;}
        
        .date-control { background: #eaf2f8; padding: 15px; border-radius: 10px; margin-bottom: 20px; display: flex; align-items: center; gap: 15px; border: 1px solid #d6eaf8; }
        .date-control input[type="date"] { font-size: 1.2rem; color: #2980b9; font-weight: bold; padding: 8px; border: 2px solid #2980b9; }
        .nav-btn-setup { background: rgba(41, 128, 185, 0.1); color: #2980b9; border: 1px solid rgba(41, 128, 185, 0.3); border-radius: 8px; width: 36px; height: 36px; display: flex; justify-content: center; align-items: center; font-size: 1.2rem; cursor: pointer; transition: 0.2s; padding: 0; }
        .nav-btn-setup:hover { background: rgba(41, 128, 185, 0.2); transform: scale(1.05); }
        .save-indicator { font-size: 0.9em; color: #27ae60; font-weight: bold; opacity: 0; transition: opacity 0.5s; }
        .save-indicator.show { opacity: 1; }

        .control-group { margin-bottom: 25px; }
        .control-group label { display: block; margin-bottom: 8px; font-weight: 700; color: #555; font-size: 1.1rem; border-left: 4px solid #2980b9; padding-left: 10px;}
        input[type="text"], input[type="number"], input[type="time"], textarea { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1rem; background: #fff; transition: border-color 0.2s;}
        input:focus { border-color: #2980b9; outline: none; }
        
        .input-row { display: flex; gap: 10px; }
        .setup-list { margin-top: 15px; display: flex; flex-direction: column; gap: 8px; }
        .setup-list-item { display: flex; justify-content: space-between; align-items: center; background: #f8f9fa; padding: 10px 15px; border-radius: 6px; border: 1px solid #eee; }

        .sync-option { display: flex; align-items: center; margin-top: 8px; color: #e67e22; font-weight: bold; font-size: 0.95rem; cursor: pointer; }
        .sync-option input { width: auto; margin-right: 8px; cursor: pointer; transform: scale(1.2); }

        /* Dashboard 黑板畫面 */
        #dashboard-screen { 
            background-color: var(--board-bg);
            background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            border: 20px solid var(--board-frame);
            border-radius: 8px;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
            padding: 30px; padding-bottom: 15px; height: 100vh; width: 100vw; box-sizing: border-box; display: none; 
        }
        #dashboard-screen.active { display: flex; flex-direction: column; }
        
        .dashboard-layout { display: flex; flex-grow: 1; height: calc(100% - 90px); overflow: hidden; margin-bottom: 10px;}
        .chalk-panel { display: flex; flex-direction: column; height: 100%; overflow: hidden; position: relative; }
        .left-panel { flex-shrink: 0; padding-right: 25px; }
        .right-panel { flex-grow: 1; padding-left: 25px; }

        .resizer { width: 16px; margin: 0 -8px; cursor: col-resize; display: flex; justify-content: center; align-items: center; z-index: 10; transition: background 0.2s; border-radius: 8px; }
        .resizer:hover, .resizer.dragging { background: rgba(255,255,255,0.1); }
        .resizer-line { width: 4px; height: 50px; background: rgba(255,255,255,0.3); border-radius: 2px; }

        .panel-header-container { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; border-bottom: 2px dashed rgba(255,255,255,0.2); padding-bottom: 10px; position: relative; z-index: 20; }
        .panel-header-container.big-title { border-bottom: 3px solid rgba(255,255,255,0.3); margin-bottom: 20px; }
        .panel-header { font-size: 1.8em; font-weight: 700; color: var(--chalk-white); text-shadow: var(--chalk-shadow); }
        .right-panel .panel-header-container.big-title .panel-header { font-size: 2.5em; }

        .global-controls-wrapper { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 0 auto; }
        .global-controls-wrapper button { background: rgba(255,255,255,0.15); color: var(--chalk-white); border-radius: 6px; border: 1px solid rgba(255,255,255,0.3); height: 34px; padding: 0 12px; font-size: 0.95rem; font-weight: bold; transition: 0.3s; cursor: pointer; backdrop-filter: blur(2px); }
        .global-controls-wrapper button:hover { background: rgba(255,255,255,0.9); color: #1a3c2b; }

        .font-adjust-btns { display: flex; gap: 5px; margin-bottom: 5px;}
        .font-adjust-btns button { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 2px 10px; border-radius: 6px; font-size: 1rem; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .font-adjust-btns button:hover { background: rgba(255,255,255,0.3); transform: scale(1.05);}
        
        .list-area { flex-grow: 1; overflow: auto; padding-right: 15px; position: relative; z-index: 10; }
        .list-area::-webkit-scrollbar { width: 8px; height: 8px; }
        .list-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }

        .circle-number {
            background-color: var(--chalk-yellow); color: #1a3c2b;
            min-width: 40px; height: 40px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 24px; font-weight: 900; 
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3); flex-shrink: 0; text-shadow: none;
        }
        .right-panel .circle-number { min-width: 50px; height: 50px; font-size: 28px; }

        /* 👑 核心排版修復：絕對防止重疊與聲調錯位 👑 */
        
        /* 基礎字體放大縮小變數綁定 */
        .left-panel .list-item-text { font-size: calc(1.6rem * var(--left-scale)); } 
        .right-panel .list-item-text { font-size: calc(1.6rem * var(--right-scale)); }

        .list-item-text { font-weight: 700; color: var(--chalk-white); text-shadow: var(--chalk-shadow); display: inline; line-height: 1; }
        
        /* 內部字元全部繼承父層的比例 (不再寫死 1.6em) */
        .moe-rb, .punct, .eng-num, .char { font-size: 1em; }

        /* --- 橫書排版 --- */
        .list-area.horizontal { display: block; padding-bottom: 20px; }
        .list-area.horizontal .list-item-container { display: flex; align-items: flex-start; margin-bottom: 25px; cursor: pointer; }
        .list-area.horizontal .circle-number { margin-right: 20px; margin-top: 5px; }
        .list-area.horizontal .list-item-text { display: block; line-height: 1.8; letter-spacing: 0.05em; }
        .list-area.horizontal .eng-num, .list-area.horizontal .punct, .list-area.horizontal .char, .list-area.horizontal .bopomofo-char { display: inline-block; }
        ruby { ruby-align: center; }
        rt { font-size: 0.4em; color: var(--chalk-yellow); font-weight: normal; letter-spacing: -0.05em; font-family: "Bopomofo", "Noto Sans TC", sans-serif; }

        /* --- 直書排版 (鋼鐵防護架構) --- */
        .list-area.vertical { 
            writing-mode: vertical-rl; text-orientation: mixed; height: 100%; 
            overflow-x: auto; overflow-y: hidden;
            padding-bottom: 20px; padding-top: 40px; padding-right: 60px; box-sizing: border-box; 
        }
        .list-area.vertical .list-item-container { 
            display: block; margin-left: 3.5em; margin-top: 15px; cursor: pointer; 
        }
        .list-area.vertical .circle-number { display: inline-flex; writing-mode: horizontal-tb; vertical-align: middle; margin-bottom: 0.1em; }
        
        /* 1. 國字本體容器：強制保留右側實體空間 (padding-right)，防止下一行靠過來 */
        .moe-char-vert { 
            display: inline-block; 
            position: relative; 
            vertical-align: middle; 
            margin: 0.1em 0; 
            box-sizing: border-box; 
            padding-right: 1.1em; /* 這是保護注音的實體圍牆！ */
        }
        
        /* 2. 注音軌道：放置在保留的 padding-right 空間內 */
        .moe-rt { 
            position: absolute; 
            top: 0; 
            right: 0; 
            width: 1.1em; 
            height: 100%; 
            display: flex; 
            justify-content: center; 
            align-items: center; /* 讓注音相對於國字垂直置中 */
            writing-mode: horizontal-tb; /* 確保 Flex 排列不受直書干擾 */
        }
        
        /* 3. 【全新機制】注音鎖定艙：將聲符與聲調綁在一起，永不分離 */
        .bopo-wrapper {
            position: relative; 
            display: inline-flex; 
            flex-direction: column; 
            align-items: center;
        }
        .bopo-wrapper .sym { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            font-size: 0.35em; /* 注音的大小 (相對於 1em 的國字) */
            line-height: 1.05; 
            font-family: "Bopomofo", "Noto Sans TC", sans-serif; 
            color: var(--chalk-yellow); 
        }
        .bopo-wrapper .sym span { display: block; }
        
        /* 4. 聲調精準定位 (以 bopo-wrapper 為基準) */
        .bopo-wrapper .tone { 
            position: absolute; 
            right: -0.85em; /* 緊貼在注音符號的右側 */
            bottom: 0;      /* 緊貼在最後一個韻符的底部 */
            font-size: 0.35em; /* 大小與注音符號同步 */
            font-weight: bold; 
            color: var(--chalk-yellow); 
            line-height: 1; 
        }
        .bopo-wrapper .tone-light { 
            position: absolute; 
            top: -0.85em; /* 緊貼在注音符號的正上方 */
            left: 50%; 
            transform: translateX(-50%); 
            font-size: 0.35em; 
            font-weight: bold; 
            color: var(--chalk-yellow); 
        }

        /* 5. 英數字與標點：加上相同的 padding-right 作為實體防護牆！ */
        .list-area.vertical .eng-num { 
            writing-mode: horizontal-tb; 
            display: inline-block; 
            font-family: Arial, sans-serif; 
            font-weight: 900; 
            white-space: nowrap; 
            margin: 0.1em 0; 
            vertical-align: middle; 
            transform: translateY(0.1em); 
            padding-right: 1.1em; /* 強制防護！ */
        }
        .list-area.vertical .punct { 
            display: inline-block; 
            vertical-align: middle; 
            margin: 0.05em 0; 
            padding-right: 1.1em; /* 強制防護！ */
        }
        
        /* 👑 顯示模式切換 👑 */
        body.mode-char-only rt, body.mode-char-only .moe-rt { display: none !important; }
        
        /* 純注音模式 */
        body.mode-bpmf-only rb, body.mode-bpmf-only .moe-rb, body.mode-bpmf-only .char { display: none !important; } 
        body.mode-bpmf-only .eng-num, body.mode-bpmf-only .punct { color: var(--chalk-white) !important; display: inline-block !important; }
        
        /* 【修正 1：純注音模式下，卸除英數字的防護牆使其居中歸位】 */
        body.mode-bpmf-only .list-area.vertical .eng-num,
        body.mode-bpmf-only .list-area.vertical .punct {
            padding-right: 0;
            transform: translateY(0);
            margin: 0.2em 0;
        }

        body.mode-bpmf-only .moe-char-vert { padding-right: 0; margin: 0.1em 0; } 
        
        /* 【修正 2：加寬藍色外框內部空間 (Padding)，徹底包覆聲調】 */
        body.mode-bpmf-only .list-area.vertical .moe-char-vert.has-ruby { 
            border: 2px solid #5dade2; 
            border-radius: 8px; 
            /* 調整 padding: 上 右 下 左。右側加到 0.9em 確保聲調不超框 */
            padding: 0.2em 0.9em 0.25em 0.2em; 
            box-sizing: border-box; 
            background-color: transparent; 
            height: auto;
        }
        /* 如果有輕聲，上方額外加高確保輕聲點不超框 */
        body.mode-bpmf-only .list-area.vertical .moe-char-vert.has-light-tone { 
            padding-top: 0.9em; 
        }

        body.mode-bpmf-only .moe-rt { position: static; width: auto; height: auto; display: inline-flex; }
        
        /* 純注音模式下，注音字體放大以填補國字消失的空間 */
        body.mode-bpmf-only .bopo-wrapper .sym { font-size: 1em; color: var(--chalk-white); }
        /* 聲調維持位置，由外框的 padding 負責包覆 */
        body.mode-bpmf-only .bopo-wrapper .tone { font-size: 1em; right: -0.7em; bottom: 0; color: var(--chalk-white); } 
        body.mode-bpmf-only .bopo-wrapper .tone-light { font-size: 1em; top: -0.85em; color: var(--chalk-white); }
        
        body.mode-bpmf-only .list-area.horizontal ruby { border: 2px solid #5dade2; border-radius: 8px; padding: 4px 6px; margin: 0 4px; display: inline-block; line-height: 1.2; }
        body.mode-bpmf-only .list-area.horizontal rt { font-size: 1em; color: var(--chalk-white); line-height: 1.5; }

        /* 隱藏一般模式下原生注音字元 (ㄅ本的ㄅ) 旁邊的空注音框 */
        body:not(.mode-bpmf-only) .bopomofo-only-char .moe-rt,
        body:not(.mode-bpmf-only) ruby.bopomofo-only-char rt { display: none !important; }

        /* --- 其餘版面設定 --- */
        .duty-section { margin-top: auto; padding-top: 20px; border-top: 2px dashed rgba(255,255,255,0.3); background: rgba(0,0,0,0.1); padding: 20px; border-radius: 8px; }
        .duty-label { font-size: 1.2em; opacity: 0.8; margin-bottom: 8px; display: block; }
        .duty-content { font-size: calc(1.8em * var(--left-scale)); font-weight: 700; color: var(--chalk-yellow); text-shadow: var(--chalk-shadow); letter-spacing: 1px; }

        .top-info-bar { display: flex; align-items: center; justify-content: space-between; padding-bottom: 20px; border-bottom: 2px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        .date-navigator { display: flex; align-items: center; gap: 15px; }
        .nav-btn { background: rgba(255,255,255,0.1); color: var(--chalk-white); border: 1px solid rgba(255,255,255,0.2); border-radius: 50%; width: 40px; height: 40px; display: flex; justify-content: center; align-items: center; font-size: 1.2em; cursor: pointer; transition: 0.2s; padding: 0; }
        .nav-btn:hover { background: var(--nav-btn-hover); transform: scale(1.1); }
        .date-display-group { text-align: center; }
        .date-display { font-size: 1.6em; color: var(--chalk-yellow); font-weight: 700; letter-spacing: 2px; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); display: flex; flex-direction: column; }
        .date-sub { font-size: 0.6em; color: rgba(255,255,255,0.7); font-weight: normal; margin-top: 5px; }
        .time-box { text-align: right; }
        .digital-clock { font-size: 2.5em; font-weight: 700; font-family: 'Noto Sans TC', monospace; line-height: 1; color: rgba(255,255,255,0.9); white-space: pre-line;}
        .absentee-text { font-size: 1.8em; color: #ff6b6b; font-weight: bold; text-shadow: var(--chalk-shadow); max-width: 400px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* 自助打卡列專屬樣式 */
        .attendance-bar-wrapper {
            background: rgba(0,0,0,0.25);
            border-radius: 8px;
            padding: 10px 15px;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
        }
        .attendance-bar {
            display: flex;
            gap: clamp(2px, 0.8vw, 10px);
            justify-content: center;
            align-items: center;
            width: 100%;
            padding-bottom: 8px;
            padding-top: 5px;
        }
        
        .att-seat {
            flex: 1 1 0px; 
            max-width: 45px; 
            min-width: 15px; 
            aspect-ratio: 1 / 1; 
            height: auto; 
            border-radius: 50%; 
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(0.6rem, 1.8vw, 1.2rem); 
            font-weight: 900;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
            user-select: none;
            position: relative;
        }
        .att-seat:active { transform: scale(0.95); }
        .att-seat.default { background: #ff7675; color: white; border: 2px solid rgba(255,255,255,0.2); }
        .att-seat.leave { background: #7f8c8d; color: #ecf0f1; cursor: not-allowed; opacity: 0.6; }
        .att-seat.on-time { background: #55efc4; color: #1a3c2b; box-shadow: 0 0 10px rgba(85,239,196,0.5); }
        .att-seat.late { background: #ffeaa7; color: #1a3c2b; box-shadow: 0 0 10px rgba(255,234,167,0.5); }
        .att-seat-label { position: absolute; bottom: -18px; font-size: clamp(0.5rem, 1.2vw, 0.75rem); color: #f1c40f; font-weight: bold; white-space: nowrap; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }

        #fullscreen-btn { position: fixed; bottom: 25px; right: 25px; z-index: 100; background: rgba(255,255,255,0.15); color: var(--chalk-white); border-radius: 6px; border: 1px solid rgba(255,255,255,0.3); height: 40px; padding: 0 15px; font-size: 1.1rem; font-weight: bold; transition: 0.3s; cursor: pointer; backdrop-filter: blur(2px); }
        #fullscreen-btn:hover { background: rgba(255,255,255,0.9); color: #1a3c2b; }
        #loading-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.8); z-index:9999; justify-content:center; align-items:center; color:#333; font-weight:bold; }

        /* Modals */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; justify-content: center; align-items: center; backdrop-filter: blur(3px);}
        .modal-content { background: #fff; color: #333; padding: 25px; border-radius: 12px; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.2);}
        .modal-content-large { max-width: 900px; padding: 40px; border-radius: 20px;}
        .seat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(55px, 1fr)); gap: 10px; margin-top: 15px; margin-bottom: 20px;}
        .seat-btn { padding: 10px 5px; border-radius: 8px; border: 2px solid #ecf0f1; background: #f8f9fa; cursor: pointer; font-weight: bold; text-align: center; transition: 0.1s; font-size: 1.1rem; color: #2c3e50;}

        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid #eee; padding-top: 15px;}

        #prompt-input { width: 100%; padding: 12px; margin-top: 15px; border: 2px solid #bdc3c7; border-radius: 8px; font-size: 1.1rem; }

        /* 進階注音編輯器 */
        .ruby-edit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 20px; margin-top: 25px; margin-bottom: 30px;}
        .ruby-edit-card { padding: 25px 15px; border-radius: 16px; border: 2px solid #ecf0f1; background: #f8f9fa; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .ruby-edit-char { font-size: 3rem; font-weight: 900; color: #2c3e50; margin-bottom: 15px; }
        .ruby-edit-input { width: 90%; text-align: center; padding: 12px; border: 3px solid #bdc3c7; border-radius: 10px; color: #e74c3c; font-weight: 900; font-size: 1.8rem;}

        /* 假別選擇器 */
        .leave-type-selector { display: flex; gap: 15px; margin: 15px 0; flex-wrap: wrap; background: #f4f6f7; padding: 10px; border-radius: 8px; }
        .leave-type-selector label { cursor: pointer; font-weight: bold; color: #34495e; display: flex; align-items: center; gap: 5px; }
        .leave-type-selector input[type="radio"] { transform: scale(1.2); cursor: pointer; }

        @media (max-width: 900px) {
            #dashboard-screen { padding: 15px; padding-bottom: 10px;}
            .dashboard-layout { flex-direction: column; gap: 20px;}
            .left-panel { width: 100% !important; height: auto; max-height: 40vh; border-bottom: 2px dashed rgba(255,255,255,0.2); padding-bottom: 20px; padding-right: 0;}
            .right-panel { padding-left: 0; }
            .resizer { display: none; }
        }

        /* 👑 核心優化：精準辨識原生注音符號 (例如「ㄅ」) 👑 */
        function generateRubyData(text) {
            let result = [];
            const regex = /([a-zA-Z0-9.\s~-]+)|(.)/g;
            let match;
            
            // 判斷是否為注音符號的函式 (涵蓋標準注音與擴充注音 Unicode 範圍)
            const isBopomofo = (char) => {
                const code = char.charCodeAt(0);
                return (code >= 0x3100 && code <= 0x312F) || (code >= 0x31A0 && code <= 0x31BA);
            };

            while ((match = regex.exec(text)) !== null) {
                if (match[1]) {
                    result.push({ char: match[1], bpmf: '', type: 'eng-num' });
                } else if (match[2]) {
                    const char = match[2];
                    
                    // ✨✨ 關鍵：攔截原生注音符號！✨✨
                    if (isBopomofo(char)) {
                        result.push({ char: char, bpmf: char, type: 'char', isBopomofoOnly: true });
                        continue;
                    }
                    
                    if (/[a-zA-Z0-9\s，。！？、；：()（）_《》「」【】.]/.test(char)) {
                        result.push({ char: char, bpmf: '', type: 'punct' });
                    } else {
                        try {
                            let pyRes = window.pinyinPro.pinyin(char, { type: 'array', toneType: 'num' });
                            if (!pyRes || pyRes.length === 0) {
                                result.push({ char: char, bpmf: '', type: 'char' });
                                continue;
                            }
                            let pyStr = pyRes[0];
                            let m = pyStr.toLowerCase().match(/([a-z]+)(\d)?/);
                            if (!m) {
                                result.push({ char: char, bpmf: '', type: 'char' });
                                continue;
                            }
                            let py = m[1].replace('ü', 'v');
                            let tone = m[2] || '1';
                            let bpmf = py2bpmf[py] || '';
                            
                            if (!bpmf) {
                                result.push({ char: char, bpmf: '', type: 'char' });
                                continue;
                            }
                            if (tone === '2') bpmf += 'ˊ'; else if (tone === '3') bpmf += 'ˇ'; else if (tone === '4') bpmf += 'ˋ'; else if (tone === '0') bpmf = '˙' + bpmf;
                            result.push({ char: char, bpmf: bpmf, type: 'char' });
                        } catch(e) {
                            result.push({ char: char, bpmf: '', type: 'char' });
                        }
                    }
                }
            }
            return result;
        }

        function upgradeDataStructure(list) {
            if (!list) return [];
            return list.map(item => {
                if (typeof item === 'string') return { rawText: item, rubyData: generateRubyData(item) };
                else if (item && typeof item === 'object') {
                    // 如果沒有 rubyData (極舊格式)，就重新生成
                    if (!item.rubyData) {
                        item.rubyData = generateRubyData(item.rawText || "");
                    } else {
                        // 🌟 關鍵修復：保留手動修改的注音，只針對舊資料補上 isBopomofoOnly 標記！
                        const isBopomofo = (char) => {
                            const code = char.charCodeAt(0);
                            return (code >= 0x3100 && code <= 0x312F) || (code >= 0x31A0 && code <= 0x31BA);
                        };
                        item.rubyData.forEach(rObj => {
                            if (rObj.type === 'char' && isBopomofo(rObj.char) && !rObj.hasOwnProperty('isBopomofoOnly')) {
                                rObj.isBopomofoOnly = true;
                            }
                        });
                    }
                    return item;
                }
                return { rawText: '', rubyData: [] };
            });
        }

        function getRubyHTMLFromData(rubyData, currentWritingMode) {
            let htmlStr = "";
            (rubyData || []).forEach(r => {
                if (r.type === 'eng-num') {
                    htmlStr += `<span class="eng-num">${r.char}</span>`;
                } else if (r.type === 'punct') {
                    htmlStr += `<span class="punct">${r.char}</span>`;
                } else if (r.type === 'char') {
                    if (r.bpmf && currentWritingMode === 'vertical') {
                        let sym = r.bpmf; let tone = ''; let isLight = false;
                        if (sym.startsWith('˙')) { isLight = true; sym = sym.substring(1); tone = '˙'; }
                        else { 
                            const last = sym.slice(-1); 
                            if (['ˊ','ˇ','ˋ'].includes(last)) { tone = last; sym = sym.slice(0, -1); } 
                        }
                        const symHtml = sym.split('').map(c => `<span>${c}</span>`).join('');
                        
                        let extraClass = 'has-ruby' + (isLight ? ' has-light-tone' : '') + (r.isBopomofoOnly ? ' bopomofo-only-char' : '');
                        
                        // ✨ 終極版注音包裝結構 (bopo-wrapper) ✨
                        htmlStr += `<span class="moe-char-vert ${extraClass}">
                            <span class="moe-rb">${r.char}</span>
                            <span class="moe-rt">
                                <span class="bopo-wrapper">
                                    ${isLight ? `<span class="tone-light">˙</span>` : ''}
                                    <span class="sym">${symHtml}</span>
                                    ${tone && !isLight ? `<span class="tone">${tone}</span>` : ''}
                                </span>
                            </span>
                        </span>`;
                    } else if (r.bpmf && currentWritingMode === 'horizontal') {
                        let extraClass = r.isBopomofoOnly ? ' class="bopomofo-only-char"' : '';
                        htmlStr += `<ruby${extraClass}><rb>${r.char}</rb><rt>${r.bpmf}</rt></ruby>`;
                    } else {
                        htmlStr += (currentWritingMode === 'vertical') ? `<span class="moe-char-vert no-ruby"><span class="moe-rb">${r.char}</span></span>` : `<span class="char">${r.char}</span>`;
                    }
                }
            });
            return htmlStr;
        }

            globalSettings.semesterStartDate = document.getElementById('setting-semester-start').value;

            localStorage.setItem(GLOBAL_SETTING_KEY, JSON.stringify(globalSettings));
            
            if(isCloud && user) {
                db.collection('users').doc(user.uid).collection('settings_low').doc('global').set(globalSettings)
                  .then(() => showSaving("全域設定已儲存至雲端！"));
            } else {
                showSaving("全域設定已本機儲存！");
            }
            renderDashboardUI(); 
        }

        function loadDataForDate(date) {
            currentDateStr = date;
            els.setupDatePicker.value = date;
            currentData = { leftList: [], rightList: [], absentText: "", dutyText: "", leaves: {}, checkins: {} };

            const processData = (data) => {
                currentData.leftList = upgradeDataStructure(data.leftList);
                currentData.rightList = upgradeDataStructure(data.rightList);
                currentData.dutyText = data.dutyText || "";
                currentData.absentText = data.absentText || "";
                currentData.leaves = data.leaves || {};
                currentData.checkins = data.checkins || {};
                
                if (data.absentSeats && data.absentSeats.length > 0 && Object.keys(currentData.leaves).length === 0) {
                    data.absentSeats.forEach(seat => currentData.leaves[seat] = '事假');
                }
            };

            if(isCloud && user) {
                if(unsubscribe) unsubscribe();
                const docRef = db.collection('users').doc(user.uid).collection('board_records_low').doc(date);
                els.loading.style.display = 'flex';
                unsubscribe = docRef.onSnapshot(doc => {
                    if(doc.exists) processData(doc.data());
                    renderSetupUI(); renderDashboardUI();
                    els.loading.style.display = 'none';
                });
            } else {
                if(allLocalData[date]) processData(allLocalData[date]);
                renderSetupUI(); renderDashboardUI();
            }
        }

        function saveData() {
            showSaving();
            if(isCloud && user) {
                db.collection('users').doc(user.uid).collection('board_records_low').doc(currentDateStr).set(currentData);
            } else {
                allLocalData[currentDateStr] = currentData;
                localStorage.setItem(LOCAL_KEY, JSON.stringify(allLocalData));
            }
            renderDashboardUI();
        }

        window.openAbsentModal = function() {
            tempLeaves = currentData.leaves ? {...currentData.leaves} : {};
            renderSeatGrid();
            els.absentModal.style.display = 'flex';
        }
        window.closeAbsentModal = function() { els.absentModal.style.display = 'none'; }

        function renderSeatGrid() {
            els.seatGrid.innerHTML = '';
            let selectedTypeNode = document.querySelector('input[name="leave-type"]:checked');
            let selectedType = selectedTypeNode ? selectedTypeNode.value : '事假';
            
            for(let i = 1; i <= globalSettings.maxSeat; i++) {
                if(globalSettings.excludedSeats.includes(i)) continue;

                const btn = document.createElement('div');
                let isLeave = tempLeaves[i] !== undefined;
                btn.className = `seat-btn ${isLeave ? 'leave-selected' : ''}`;
                btn.innerHTML = `${i} <small>${isLeave ? tempLeaves[i] : ''}</small>`;
                
                btn.onclick = () => {
                    if(selectedType === '取消') {
                        delete tempLeaves[i];
                    } else {
                        tempLeaves[i] = selectedType;
                        if(currentData.checkins && currentData.checkins[i]) delete currentData.checkins[i];
                    }
                    renderSeatGrid();
                };
                els.seatGrid.appendChild(btn);
            }
        }

        document.querySelectorAll('input[name="leave-type"]').forEach(radio => radio.addEventListener('change', renderSeatGrid));

        window.confirmAbsentModal = function() {
            currentData.leaves = {...tempLeaves};
            currentData.absentText = ""; 
            closeAbsentModal();
            saveData();
            renderSetupUI();
            renderDashboardUI();
        }

        function renderAttendanceBar() {
            els.attendanceBar.innerHTML = '';
            let totalSeats = 0;
            let onTimeCount = 0; let lateCount = 0; let leaveCount = 0;

            for(let i = 1; i <= globalSettings.maxSeat; i++) {
                if(globalSettings.excludedSeats.includes(i)) continue;
                totalSeats++;

                const seatDiv = document.createElement('div');
                seatDiv.className = 'att-seat';
                let statusClass = 'default';
                let extraLabel = '';

                if (currentData.leaves && currentData.leaves[i]) {
                    statusClass = 'leave';
                    extraLabel = `<span class="att-seat-label" style="color:#bdc3c7;">${currentData.leaves[i]}</span>`;
                    leaveCount++;
                } else if (currentData.checkins && currentData.checkins[i]) {
                    statusClass = currentData.checkins[i];
                    if (statusClass === 'on-time') onTimeCount++;
                    if (statusClass === 'late') lateCount++;
                }

                seatDiv.classList.add(statusClass);
                seatDiv.innerHTML = `${i} ${extraLabel}`;

                seatDiv.onclick = () => handleCheckIn(i);
                seatDiv.ondblclick = () => handleCancelCheckIn(i);

                els.attendanceBar.appendChild(seatDiv);
            }
            
            let notArrived = totalSeats - onTimeCount - lateCount - leaveCount;
            let summaryText = "";
            if (leaveCount > 0) summaryText += `請假:${leaveCount}人 `;
            if (lateCount > 0) summaryText += `遲到:${lateCount}人 `;
            if (notArrived > 0) summaryText += `未到:${notArrived}人 `;
            
            if(summaryText === "") {
                els.displayAbsent.textContent = "全勤";
                els.displayAbsent.style.color = 'rgba(255,255,255,0.5)';
            } else {
                els.displayAbsent.textContent = summaryText;
                els.displayAbsent.style.color = '#ff6b6b';
            }
        }

        function handleCheckIn(seatNum) {
            if (currentData.leaves && currentData.leaves[seatNum]) return; 
            if (currentData.checkins && currentData.checkins[seatNum]) return; 

            let now = new Date();
            let timeStr = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
            let status = (timeStr <= globalSettings.lateTime) ? 'on-time' : 'late';
            
            if (!currentData.checkins) currentData.checkins = {};
            currentData.checkins[seatNum] = status;
            
            saveData();
        }

        function handleCancelCheckIn(seatNum) {
            if (currentData.leaves && currentData.leaves[seatNum]) return; 
            if (currentData.checkins && currentData.checkins[seatNum]) {
                delete currentData.checkins[seatNum];
                saveData();
            }
        }

        window.openStatsModal = async function() {
            document.getElementById('stats-modal').style.display = 'flex';
            document.getElementById('stats-date-range').textContent = `${globalSettings.semesterStartDate} ~ 至今`;
            const tbody = document.getElementById('stats-tbody');
            tbody.innerHTML = '<tr><td colspan="7">資料計算中，請稍候...</td></tr>';

            let stats = {};
            for(let i=1; i<=globalSettings.maxSeat; i++) {
                if(!globalSettings.excludedSeats.includes(i)) {
                    stats[i] = { onTime:0, late:0, shijia:0, bingjia:0, sangjia:0, gongjia:0 };
                }
            }

            let records = {};
            if (isCloud && user) {
                const snapshot = await db.collection('users').doc(user.uid).collection('board_records_low').get();
                snapshot.forEach(doc => { records[doc.id] = doc.data(); });
            } else {
                records = allLocalData;
            }

            const todayStr = new Date().toISOString().slice(0,10);
            for (const [date, data] of Object.entries(records)) {
                if (date >= globalSettings.semesterStartDate && date <= todayStr) {
                    if(data.checkins) {
                        for(const [seat, status] of Object.entries(data.checkins)) {
                            if(stats[seat]) {
                                if(status === 'on-time') stats[seat].onTime++;
                                if(status === 'late') stats[seat].late++;
                            }
                        }
                    }
                    let leaves = data.leaves || {};
                    if(data.absentSeats && data.absentSeats.length > 0 && Object.keys(leaves).length===0) {
                        data.absentSeats.forEach(s => leaves[s] = '事假');
                    }
                    for(const [seat, type] of Object.entries(leaves)) {
                        if(stats[seat]) {
                            if(type === '事假') stats[seat].shijia++;
                            else if(type === '病假') stats[seat].bingjia++;
                            else if(type === '喪假') stats[seat].sangjia++;
                            else if(type === '公假') stats[seat].gongjia++;
                        }
                    }
                }
            }

            tbody.innerHTML = '';
            const fmt = (val, highlightColor) => {
                if (val > 0) return `<span style="color:${highlightColor}; font-weight:900; font-size:1.2em;">${val}</span>`;
                return `<span style="color:#bdc3c7; font-weight:normal;">0</span>`;
            };

            for(let i=1; i<=globalSettings.maxSeat; i++) {
                if(globalSettings.excludedSeats.includes(i)) continue;
                let s = stats[i];
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="font-weight:900; color:#2c3e50; font-size:1.2em;">${i}</td>
                    <td>${fmt(s.onTime, '#27ae60')}</td>
                    <td>${fmt(s.late, '#f39c12')}</td>
                    <td>${fmt(s.shijia, '#e74c3c')}</td>
                    <td>${fmt(s.bingjia, '#e74c3c')}</td>
                    <td>${fmt(s.sangjia, '#e74c3c')}</td>
                    <td>${fmt(s.gongjia, '#8e44ad')}</td>
                `;
                tbody.appendChild(tr);
            }
        }
        window.closeStatsModal = function() { document.getElementById('stats-modal').style.display = 'none'; }

        function renderSetupUI() {
            document.getElementById('duty-input').value = currentData.dutyText || "";
            
            let leavesArr = Object.keys(currentData.leaves || {}).map(k => `${k}號(${currentData.leaves[k]})`);
            if (leavesArr.length > 0) {
                els.setupAbsentDisplay.textContent = leavesArr.join('、');
                els.setupAbsentDisplay.style.color = '#e74c3c';
            } else if (currentData.absentText) {
                els.setupAbsentDisplay.textContent = currentData.absentText;
            } else {
                els.setupAbsentDisplay.textContent = "全勤";
                els.setupAbsentDisplay.style.color = '#27ae60';
            }
            
            const buildListHTML = (list, side) => {
                let html = '';
                list.forEach((item, idx) => {
                    let text = item.rawText || "";
                    html += `<div class="setup-list-item"><span><b style="color:#2980b9">${idx+1}.</b> ${text}</span>
                        <div style="display:flex; gap:5px;">
                            <button class="btn-edit" onclick="editItemText('${side}', ${idx})">✎ 編輯</button>
                            <button class="btn-primary" style="padding: 5px 10px; font-size: 0.9em; background:#9b59b6; border: 1px solid #8e44ad;" onclick="openBpmfEditor('${side}', ${idx})">ㄅㄆㄇ 注音</button>
                            <button class="btn-danger" onclick="removeItem('${side}', ${idx})">刪除</button>
                        </div></div>`;
                });
                return html;
            };
            document.getElementById('left-setup-list').innerHTML = buildListHTML(currentData.leftList || [], 'left');
            document.getElementById('right-setup-list').innerHTML = buildListHTML(currentData.rightList || [], 'right');
        }

        function renderDashboardUI() {
            const dateObj = new Date(currentDateStr);
            const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            
            els.dateDisplay.textContent = currentDateStr.replace(/-/g, '/');
            els.dayDisplay.textContent = days[dateObj.getDay()];
            document.getElementById('display-duty').textContent = currentData.dutyText || "無";
            
            renderAttendanceBar(); 
            
            renderBoardList(document.getElementById('display-left-list'), currentData.leftList, "(無提醒)");
            renderBoardList(document.getElementById('display-right-list'), currentData.rightList, "(今日無作業)");
        }

        function renderBoardList(container, list, emptyMsg) {
            container.innerHTML = '';
            if (writingMode === 'vertical') { container.classList.add('vertical'); container.classList.remove('horizontal'); } 
            else { container.classList.add('horizontal'); container.classList.remove('vertical'); }

            if(!list || list.length === 0) container.innerHTML = `<div style="opacity:0.5; font-size:1.5rem; margin-top:10px;">${emptyMsg}</div>`;
            else {
                list.forEach((item, idx) => {
                    const containerDiv = document.createElement('div'); containerDiv.className = 'list-item-container'; 
                    containerDiv.onclick = () => { window.speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(item.rawText); u.lang = 'zh-TW'; u.rate = 0.85; window.speechSynthesis.speak(u); };
                    const el = document.createElement('div'); el.className = 'list-item-text'; el.innerHTML = getRubyHTMLFromData(item.rubyData, writingMode);
                    const circle = document.createElement('div'); circle.className = 'circle-number'; circle.textContent = idx + 1;
                    containerDiv.appendChild(circle); containerDiv.appendChild(el); container.appendChild(containerDiv);
                });
            }
        }

        window.addItem = function(side) {
            const input = document.getElementById(side + '-input');
            const val = input.value.trim();
            if(val) {
                const newItem = { rawText: val, rubyData: generateRubyData(val) };
                if(side === 'left') {
                    if(!currentData.leftList) currentData.leftList = [];
                    currentData.leftList.push(newItem);
                } else {
                    if(!currentData.rightList) currentData.rightList = [];
                    currentData.rightList.push(newItem);
                    
                    const syncCheck = document.getElementById('sync-check');
                    if (syncCheck && syncCheck.checked) {
                        const newAssign = {
                            id: `assign_${currentDateStr}_${Date.now()}`,
                            name: val,
                            records: {}
                        };
                        
                        if (isCloud && user) {
                            db.collection('users').doc(user.uid).collection('daily_records_low').doc(currentDateStr)
                              .set({ assignments: firebase.firestore.FieldValue.arrayUnion(newAssign) }, { merge: true })
                              .then(() => showSaving("✓ 聯絡簿已同步至作業系統"))
                              .catch(err => console.error("同步失敗", err));
                        } else {
                            const LOCAL_HW_KEY = 'homework_tracker_low_data';
                            let hwData = {};
                            try { hwData = JSON.parse(localStorage.getItem(LOCAL_HW_KEY)) || {}; } catch(e){}
                            if(!hwData[currentDateStr]) hwData[currentDateStr] = [];
                            hwData[currentDateStr].push(newAssign);
                            localStorage.setItem(LOCAL_HW_KEY, JSON.stringify(hwData));
                            showSaving("✓ 已本機同步至作業系統");
                        }
                    }
                }
                input.value = ''; saveData(); renderSetupUI(); input.focus();
            }
        }
        
        window.removeItem = function(side, idx) {
            if(side === 'left') currentData.leftList.splice(idx, 1); else currentData.rightList.splice(idx, 1);
            saveData(); renderSetupUI();
        }

        // 使用 Modal 取代原生 prompt
        window.editItemText = function(side, idx) {
            const list = side === 'left' ? currentData.leftList : currentData.rightList;
            els.promptInput.value = list[idx].rawText;
            els.promptModal.style.display = 'flex';
            els.promptInput.focus();

            promptCallback = function(newVal) {
                if (newVal !== null && newVal.trim() !== '') {
                    list[idx].rawText = newVal.trim(); 
                    list[idx].rubyData = generateRubyData(newVal.trim());
                    saveData(); renderSetupUI();
                }
            };
        }

        window.closePromptModal = function() {
            els.promptModal.style.display = 'none';
            promptCallback = null;
        }

        window.confirmPromptModal = function() {
            if (promptCallback) {
                promptCallback(els.promptInput.value);
            }
            closePromptModal();
        }

        els.promptInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                confirmPromptModal();
            }
        });

        window.handleEnter = function(e, side) { if(e.key === 'Enter') window.addItem(side); }
        window.navDate = function(delta) {
            const d = new Date(currentDateStr); d.setDate(d.getDate() + delta);
            const offset = d.getTimezoneOffset() * 60000;
            loadDataForDate((new Date(d - offset)).toISOString().slice(0, 10));
        }
        els.setupDatePicker.addEventListener('change', (e) => loadDataForDate(e.target.value));
        document.getElementById('duty-input').addEventListener('change', () => { currentData.dutyText = document.getElementById('duty-input').value; saveData(); });

        window.doLogin = function() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => console.error(e.message)); }
        window.doLogout = function() { auth.signOut(); }

        function showSaving(msg = "✓ 已儲存") { els.saveIndicator.textContent = msg; els.saveIndicator.classList.add('show'); setTimeout(() => els.saveIndicator.classList.remove('show'), 2000); }

        document.getElementById('enter-dashboard-btn').addEventListener('click', () => { els.setupScreen.classList.remove('active'); els.dashboardScreen.classList.add('active'); if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{}); });
        document.getElementById('discrete-setup-btn').addEventListener('click', () => { els.dashboardScreen.classList.remove('active'); els.setupScreen.classList.add('active'); if (document.exitFullscreen && document.fullscreenElement) document.exitFullscreen().catch(()=>{}); });
        document.getElementById('fullscreen-btn').addEventListener('click', () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else if (document.exitFullscreen) document.exitFullscreen(); });

        function updateClock() {
            const now = new Date();
            const h = now.getHours().toString().padStart(2,'0'); const m = now.getMinutes().toString().padStart(2,'0');
            const ampm = now.getHours() >= 12 ? '下午' : '上午'; const h12 = now.getHours() % 12 || 12;
            if (els.digitalClock) els.digitalClock.textContent = `${ampm} ${h12.toString().padStart(2,'0')}:${m}`;
        }

        // 版面控制 (放大縮小)
        function applyFontScales() { document.documentElement.style.setProperty('--left-scale', leftFontScale); document.documentElement.style.setProperty('--right-scale', rightFontScale); }
        window.adjustFont = function(side, delta) {
            if (side === 'left') { leftFontScale = Math.max(0.5, Math.min(2.5, leftFontScale + delta)); localStorage.setItem('board_left_scale_low', leftFontScale); } 
            else { rightFontScale = Math.max(0.5, Math.min(2.5, rightFontScale + delta)); localStorage.setItem('board_right_scale_low', rightFontScale); }
            applyFontScales();
        };
        function applySplitRatio() { els.leftPanel.style.width = `calc(${splitRatio}% - 8px)`; }
        let isDragging = false;
        els.resizer.addEventListener('mousedown', () => { isDragging = true; els.resizer.classList.add('dragging'); document.body.style.cursor = 'col-resize'; });
        els.resizer.addEventListener('touchstart', () => { isDragging = true; els.resizer.classList.add('dragging'); }, {passive: true});
        document.addEventListener('mousemove', (e) => { if (!isDragging) return; let newRatio = ((e.clientX - els.dashboardLayout.getBoundingClientRect().left) / els.dashboardLayout.getBoundingClientRect().width) * 100; splitRatio = Math.max(15, Math.min(newRatio, 85)); applySplitRatio(); });
        document.addEventListener('touchmove', (e) => { if (!isDragging) return; let newRatio = ((e.touches[0].clientX - els.dashboardLayout.getBoundingClientRect().left) / els.dashboardLayout.getBoundingClientRect().width) * 100; splitRatio = Math.max(15, Math.min(newRatio, 85)); applySplitRatio(); }, {passive: true});
        document.addEventListener('mouseup', () => { if (isDragging) { isDragging = false; els.resizer.classList.remove('dragging'); document.body.style.cursor = ''; localStorage.setItem('board_split_ratio_low', splitRatio); } });
        document.addEventListener('touchend', () => { if (isDragging) { isDragging = false; els.resizer.classList.remove('dragging'); localStorage.setItem('board_split_ratio_low', splitRatio); } });
        document.getElementById('toggle-writing-btn').addEventListener('click', () => { writingMode = writingMode === 'horizontal' ? 'vertical' : 'horizontal'; localStorage.setItem('board_writing_mode_low', writingMode); renderDashboardUI(); });
        function applyDisplayMode() { document.body.classList.remove('mode-char-only', 'mode-bpmf-only'); if(modeClasses[displayMode]) document.body.classList.add(modeClasses[displayMode]); }
        document.getElementById('toggle-display-btn').addEventListener('click', () => { displayMode = (displayMode + 1) % 3; localStorage.setItem('board_display_mode_low', displayMode.toString()); applyDisplayMode(); });

        window.openBpmfEditor = function(side, idx) {
            editingSide = side; editingIndex = idx;
            const item = side === 'left' ? currentData.leftList[idx] : currentData.rightList[idx];
            document.getElementById('ruby-grid').innerHTML = '';
            item.rubyData.forEach((rObj, i) => {
                if (rObj.type !== 'char') return; 
                const card = document.createElement('div'); card.className = 'ruby-edit-card';
                card.innerHTML = `<div class="ruby-edit-char">${rObj.char}</div><input type="text" class="ruby-edit-input" id="edit-bpmf-${i}" value="${rObj.bpmf}" placeholder="空白">`;
                document.getElementById('ruby-grid').appendChild(card);
            });
            document.getElementById('bpmf-modal').style.display = 'flex';
        }
        window.closeBpmfModal = function() { document.getElementById('bpmf-modal').style.display = 'none'; }
        window.saveBpmfModal = function() {
            const item = editingSide === 'left' ? currentData.leftList[editingIndex] : currentData.rightList[editingIndex];
            item.rubyData.forEach((rObj, i) => { const input = document.getElementById(`edit-bpmf-${i}`); if (input) rObj.bpmf = input.value.trim(); });
            closeBpmfModal(); saveData(); renderDashboardUI();
        }
    </script>
</body>
</html>
