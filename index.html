<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班級電子看板（三欄直式方格與聲調鎖定版）</title>
    
    <!-- 雲端資料庫套件 -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <!-- 載入注音轉換核心 -->
    <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.24.2/dist/index.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        
        :root {
            --board-bg: #1a3c2b;
            --board-frame: #8d5e3c;
            --chalk-white: #f0f0f0;
            --chalk-yellow: #f1c40f;
            --chalk-shadow: 2px 2px 0px rgba(0,0,0,0.18);
            --accent-color: #f39c12; 
            --danger-color: #e74c3c;
            --nav-btn-hover: rgba(255,255,255,0.15);
            /* 三欄獨立方格縮放變數 */
            --morning-scale: 1.05;
            --left-scale: 1.05;
            --right-scale: 1.15;
        }

        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            color: var(--chalk-white);
            background-color: #f0f2f5;
            overflow: hidden;
        }

        /* --- 基礎按鈕樣式 --- */
        button { cursor: pointer; border: none; font-weight: 700; padding: 10px 18px; border-radius: 8px; transition: 0.2s; font-family: inherit; }
        .btn-primary { background: #2980b9; color: #fff; }
        .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-secondary { background: #bdc3c7; color: #2c3e50; }
        .btn-secondary:hover { background: #aab7b8; }
        .btn-edit { background: rgba(243, 156, 18, 0.1); color: #d35400; padding: 6px 12px; font-size: 0.95em; border: 1px solid #f39c12; }
        .btn-edit:hover { background: rgba(243, 156, 18, 0.2); }
        .btn-danger { background: rgba(231, 76, 60, 0.1); color: var(--danger-color); padding: 6px 12px; font-size: 0.95em; border: 1px solid var(--danger-color);}
        .btn-danger:hover { background: rgba(231, 76, 60, 0.2); }
        
        .cloud-bar { background: #fff; padding: 15px; margin-bottom: 20px; border-radius: 12px; border: 1px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .user-chip { display: flex; align-items: center; gap: 10px; color: #2c3e50; font-weight: bold; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #ccc; }
        .status-dot.online { background: #2ecc71; box-shadow: 0 0 5px #2ecc71; }
        .btn-google { background: #fff; border: 1px solid #ddd; color: #555; display: flex; align-items: center; gap: 8px; padding: 8px 16px; }
        .btn-google:hover { background: #f8f9fa; }

        .app-screen { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; overflow-y: auto; }
        .app-screen.active { display: block; animation: fadeIn 0.35s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- 後台設定畫面 --- */
        #setup-screen { background: #f4f6f7; color: #333; }
        .container { max-width: 960px; margin: 0 auto; padding: 35px 20px; min-height: 100vh; display: flex; flex-direction: column; justify-content: center;}
        .setup-card { background: #fff; padding: 35px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid #e0e0e0; position: relative; }
        .header h1 { text-align: center; color: #2c3e50; margin-bottom: 15px; font-weight: 900;}
        
        .date-control { background: #eaf2f8; padding: 15px; border-radius: 10px; margin-bottom: 20px; display: flex; align-items: center; gap: 15px; border: 1px solid #d6eaf8; flex-wrap: wrap; }
        .date-control input[type="date"] { font-size: 1.2rem; color: #2980b9; font-weight: bold; padding: 8px; border: 2px solid #2980b9; border-radius: 6px; }
        .nav-btn-setup { background: rgba(41, 128, 185, 0.1); color: #2980b9; border: 1px solid rgba(41, 128, 185, 0.3); border-radius: 8px; width: 38px; height: 38px; display: flex; justify-content: center; align-items: center; font-size: 1.2rem; cursor: pointer; transition: 0.2s; padding: 0; }
        .nav-btn-setup:hover { background: rgba(41, 128, 185, 0.2); transform: scale(1.05); }
        .save-indicator { font-size: 0.95em; color: #27ae60; font-weight: bold; opacity: 0; transition: opacity 0.5s; }
        .save-indicator.show { opacity: 1; }

        .control-group { margin-bottom: 25px; }
        .control-group label { display: block; margin-bottom: 8px; font-weight: 700; color: #555; font-size: 1.1rem; border-left: 4px solid #2980b9; padding-left: 10px;}
        input[type="text"], input[type="number"], input[type="time"], textarea { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1rem; background: #fff; transition: border-color 0.2s;}
        input:focus { border-color: #2980b9; outline: none; }
        
        .input-row { display: flex; gap: 10px; }
        .setup-list { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
        .setup-list-item { display: flex; justify-content: space-between; align-items: center; background: #f8f9fa; padding: 10px 15px; border-radius: 8px; border: 1px solid #eee; gap: 10px; flex-wrap: wrap; }

        .sync-option { display: flex; align-items: center; margin-top: 8px; color: #e67e22; font-weight: bold; font-size: 0.95rem; cursor: pointer; border-left: none !important; padding-left: 0 !important; }
        .sync-option input { width: auto; margin-right: 8px; cursor: pointer; transform: scale(1.2); }

        /* --- 黑板主畫面 --- */
        #dashboard-screen { 
            background-color: var(--board-bg);
            background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            border: 18px solid var(--board-frame);
            border-radius: 8px;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
            padding: 16px 24px 12px 24px;
            height: 100vh;
            width: 100vw;
            box-sizing: border-box;
            display: none; 
        }
        #dashboard-screen.active { display: flex; flex-direction: column; gap: 10px; }

        /* 頂部資訊與全域控制列（整合日期、請假、精簡版值日生、三區開關、時鐘） */
        .top-info-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            padding: 8px 14px;
            background: rgba(0, 0, 0, 0.22);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 10px;
            flex-shrink: 0;
        }
        .info-left-group {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .date-navigator { display: flex; align-items: center; gap: 10px; }
        .nav-btn { background: rgba(255,255,255,0.12); color: var(--chalk-white); border: 1px solid rgba(255,255,255,0.25); border-radius: 50%; width: 38px; height: 38px; display: flex; justify-content: center; align-items: center; font-size: 1.1em; cursor: pointer; transition: 0.2s; padding: 0; }
        .nav-btn:hover { background: var(--nav-btn-hover); transform: scale(1.08); }
        .date-display-group { display: flex; align-items: baseline; gap: 8px; }
        .date-display { font-size: 1.45em; color: var(--chalk-yellow); font-weight: 900; letter-spacing: 1px; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        .date-sub { font-size: 1.1em; color: rgba(255,255,255,0.85); font-weight: 700; }

        /* 極簡醒目版：今日值日生與出缺席標籤 */
        .top-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 1.15rem;
            font-weight: 900;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            white-space: nowrap;
        }
        .duty-badge {
            color: var(--chalk-yellow);
            background: rgba(241, 196, 15, 0.14);
            border-color: rgba(241, 196, 15, 0.4);
        }
        .absentee-text {
            font-size: 1.2rem;
            color: #ff7675;
            font-weight: 900;
            text-shadow: var(--chalk-shadow);
            max-width: 280px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 頂部中間：三欄顯示開關與全域工具 */
        .global-controls-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .ctrl-btn {
            background: rgba(255,255,255,0.14);
            color: var(--chalk-white);
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.3);
            height: 36px;
            padding: 0 11px;
            font-size: 0.92rem;
            font-weight: 800;
            transition: 0.2s;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .ctrl-btn:hover { background: rgba(255,255,255,0.88); color: #1a3c2b; }
        
        /* 區塊收合開關燈號樣式 */
        .panel-toggle-btn.active-morning { background: #f39c12; color: #1e272e; border-color: #f1c40f; }
        .panel-toggle-btn.active-left { background: #27ae60; color: #ffffff; border-color: #2ecc71; }
        .panel-toggle-btn.active-right { background: #ecf0f1; color: #1e272e; border-color: #bdc3c7; }
        .panel-toggle-btn.collapsed { opacity: 0.5; background: rgba(0,0,0,0.3); color: #bdc3c7; border-style: dashed; }

        .row-count-control { display: inline-flex; align-items: center; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.3); border-radius: 8px; height: 36px; padding: 0 4px; gap: 3px; }
        .row-count-control span { font-size: 0.9rem; font-weight: 800; padding: 0 5px; color: var(--chalk-yellow); white-space: nowrap; }
        .row-count-control button { height: 26px !important; padding: 0 7px !important; font-size: 0.9rem !important; background: rgba(255,255,255,0.15); color: #fff; border-radius: 5px; }
        .row-count-control button:hover { background: rgba(255,255,255,0.35); }

        .digital-clock { font-size: 1.8em; font-weight: 900; font-family: 'Noto Sans TC', monospace; line-height: 1; color: rgba(255,255,255,0.95); white-space: nowrap; }

        /* --- 三欄主區域佈局 --- */
        .dashboard-layout {
            display: flex;
            flex-grow: 1;
            min-height: 0;
            width: 100%;
            overflow: hidden;
            align-items: stretch;
        }

        .chalk-panel {
            display: flex;
            flex-direction: column;
            height: 100%;
            min-width: 160px;
            overflow: hidden;
            position: relative;
            background: rgba(0, 0, 0, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 10px 12px;
            transition: background 0.2s;
        }

        /* 當區塊被收合時，隱藏本體，改由上方按鈕或側邊展開條控制 */
        .chalk-panel.is-collapsed {
            display: none !important;
        }

        /* 兩欄之間的拖曳分隔桿 */
        .resizer {
            width: 16px;
            flex-shrink: 0;
            cursor: col-resize;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: background 0.2s;
            border-radius: 8px;
            margin: 0 2px;
        }
        .resizer.is-hidden { display: none !important; }
        .resizer:hover, .resizer.dragging { background: rgba(255,255,255,0.15); }
        .resizer-line { width: 4px; height: 55px; background: rgba(255,255,255,0.35); border-radius: 2px; }

        /* 區塊標題列 */
        .panel-header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 8px;
            border-bottom: 2px solid rgba(255,255,255,0.22);
            padding-bottom: 6px;
            flex-shrink: 0;
        }
        .panel-title-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .panel-header {
            font-size: 1.45em;
            font-weight: 900;
            color: var(--chalk-white);
            text-shadow: var(--chalk-shadow);
            white-space: nowrap;
        }
        .panel-morning .panel-header { color: #ffeaa7; }
        .panel-left .panel-header { color: #81ecec; }
        .panel-right .panel-header { color: #ffffff; }

        .font-adjust-btns { display: flex; gap: 4px; align-items: center; }
        .font-adjust-btns button {
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            font-weight: 800;
            transition: 0.2s;
        }
        .font-adjust-btns button:hover { background: rgba(255,255,255,0.3); transform: scale(1.04); }
        .font-adjust-btns .btn-collapse-panel {
            background: rgba(231, 76, 60, 0.25);
            border-color: rgba(231, 76, 60, 0.5);
            color: #ffcccc;
        }
        .font-adjust-btns .btn-collapse-panel:hover {
            background: rgba(231, 76, 60, 0.7);
            color: #fff;
        }

        /* =========================================================
           👑 教育部標準直式注音與聲調鎖定引擎 (共用核心) 👑
           ========================================================= */
        .bopo-box {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            line-height: 1.05;
            font-family: "Bopomofo", "Noto Sans TC", sans-serif;
            user-select: none;
        }
        .bopo-box.with-side-tone {
            padding-right: 0.32em;
        }
        /* 輕聲點：固定在第一個注音符號正上方中央 */
        .bopo-box .tone-light-mark {
            display: block;
            text-align: center;
            line-height: 0.55;
            font-size: 0.95em;
            font-weight: 900;
            margin-bottom: 0.05em;
        }
        /* 每個注音符號單字容器 */
        .bopo-box .sym-char {
            display: block;
            position: relative;
            text-align: center;
            line-height: 1.05;
            font-weight: 700;
        }
        /* 二、三、四聲：絕對鎖定在「最後一個注音符號」的右側中央 */
        .bopo-box .sym-char .tone-side-mark {
            position: absolute;
            left: 92%;
            top: 50%;
            transform: translateY(-48%);
            font-size: 0.95em;
            line-height: 1;
            font-weight: 900;
            white-space: nowrap;
            pointer-events: none;
        }

        /* =========================================================
           🟫 三大直式方格區域共用結構與三大差異化主題配色 🟫
           ========================================================= */
        .panel-morning { --cell-size: calc(70px * var(--morning-scale)); }
        .panel-left    { --cell-size: calc(70px * var(--left-scale)); }
        .panel-right   { --cell-size: calc(74px * var(--right-scale)); }

        .contact-grid-wrapper {
            display: flex;
            flex-direction: row-reverse; /* 由右至左排列每一行 */
            justify-content: flex-start;
            align-items: flex-start;
            overflow-x: auto;
            overflow-y: auto;
            flex-grow: 1;
            padding: 4px 6px 12px 6px;
        }
        .contact-grid-wrapper::-webkit-scrollbar { width: 8px; height: 8px; }
        .contact-grid-wrapper::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.28); border-radius: 4px; }

        .contact-grid-board {
            display: inline-flex;
            flex-direction: row-reverse; /* 欄位由右至左排列 */
            border-radius: 8px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.35);
            overflow: hidden;
            flex-shrink: 0;
        }

        .grid-col {
            display: flex;
            flex-direction: column;
            width: var(--cell-size);
            flex-shrink: 0;
        }
        .grid-col:last-child {
            border-left: none !important;
        }

        /* 每一個方格 */
        .grid-cell {
            width: var(--cell-size);
            height: var(--cell-size);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-sizing: border-box;
            user-select: none;
            overflow: hidden;
            transition: background-color 0.15s;
        }
        .grid-cell:last-child {
            border-bottom: none !important;
        }

        /* 第一大格：項次格 */
        .grid-cell.header-cell {
            height: calc(var(--cell-size) * 0.9);
            font-size: calc(var(--cell-size) * 0.46);
            font-weight: 900;
        }
        .grid-cell.header-cell.has-num {
            cursor: pointer;
        }
        .grid-cell.header-cell.has-num:active {
            transform: scale(0.94);
        }

        /* 可點擊切換國字/注音的內容格 */
        .grid-cell.interactive-cell {
            cursor: pointer;
        }

        /* --- 主題一：☀️ 晨間任務（暖陽黃便利貼方格，代表早修任務） --- */
        .board-theme-morning {
            border: 3px solid #d68910;
            background-color: #fff9db;
        }
        .board-theme-morning .grid-col {
            border-left: 2px solid #e59866;
        }
        .board-theme-morning .grid-col.item-odd {
            background-color: #fffbeb;
            color: #2c3e50;
        }
        .board-theme-morning .grid-col.item-even {
            background-color: #fdebd0;
            color: #2c3e50;
        }
        .board-theme-morning .grid-cell {
            border-bottom: 2px solid #e59866;
        }
        .board-theme-morning .grid-cell.header-cell {
            border-bottom: 3px solid #d68910;
            color: #b9770e;
            background-color: rgba(243, 156, 18, 0.12);
        }
        .board-theme-morning .grid-cell.header-cell.has-num:hover {
            background-color: rgba(243, 156, 18, 0.35);
        }
        .board-theme-morning .grid-cell.interactive-cell:hover {
            background-color: rgba(243, 156, 18, 0.22);
        }

        /* --- 主題二：📢 提醒事項（黑板粉筆虛線方格，代表叮嚀不必抄） --- */
        .board-theme-left {
            border: 3px solid rgba(255, 255, 255, 0.45);
            background-color: #163626;
        }
        .board-theme-left .grid-col {
            border-left: 2px dashed rgba(255, 255, 255, 0.32);
        }
        .board-theme-left .grid-col.item-odd {
            background-color: #1f4734;
            color: var(--chalk-white);
        }
        .board-theme-left .grid-col.item-even {
            background-color: #143323;
            color: var(--chalk-white);
        }
        .board-theme-left .grid-cell {
            border-bottom: 2px dashed rgba(255, 255, 255, 0.32);
        }
        .board-theme-left .grid-cell.header-cell {
            border-bottom: 3px solid rgba(255, 255, 255, 0.45);
            color: var(--chalk-yellow);
            background-color: rgba(0, 0, 0, 0.2);
        }
        .board-theme-left .grid-cell.header-cell.has-num:hover {
            background-color: rgba(241, 196, 15, 0.28);
        }
        .board-theme-left .grid-cell.interactive-cell:hover {
            background-color: rgba(255, 255, 255, 0.15);
        }
        .board-theme-left .bopo-box {
            color: var(--chalk-yellow);
        }

        /* --- 主題三：📌 今日聯絡簿（白底與灰底實線方格，代表紙本聯絡簿要抄） --- */
        .board-theme-right {
            border: 3px solid #7f8c8d;
            background-color: #ffffff;
        }
        .board-theme-right .grid-col {
            border-left: 2px solid #95a5a6;
        }
        .board-theme-right .grid-col.item-odd {
            background-color: #fcfcfc;
            color: #1e272e;
        }
        .board-theme-right .grid-col.item-even {
            background-color: #dfe4ea;
            color: #1e272e;
        }
        .board-theme-right .grid-cell {
            border-bottom: 2px solid #95a5a6;
        }
        .board-theme-right .grid-cell.header-cell {
            border-bottom: 3px solid #7f8c8d;
            color: #2c3e50;
        }
        .board-theme-right .grid-cell.header-cell.has-num:hover {
            background-color: rgba(241, 196, 15, 0.35);
        }
        .board-theme-right .grid-cell.interactive-cell:hover {
            background-color: rgba(52, 152, 219, 0.18);
        }

        /* --- 方格內部文字與注音比例 --- */
        /* 1. 純國字模式 */
        .cell-char-only {
            font-size: calc(var(--cell-size) * 0.64);
            font-weight: 900;
            line-height: 1;
            color: inherit;
            text-align: center;
        }

        /* 2. 純注音模式 */
        .cell-bpmf-only {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            color: inherit;
        }
        .cell-bpmf-only .bopo-box.len-1 { font-size: calc(var(--cell-size) * 0.44); }
        .cell-bpmf-only .bopo-box.len-2 { font-size: calc(var(--cell-size) * 0.36); }
        .cell-bpmf-only .bopo-box.len-3 { font-size: calc(var(--cell-size) * 0.28); }

        /* 3. 國字＋注音模式 */
        .cell-both {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            gap: calc(var(--cell-size) * 0.03);
            padding: 2px;
            color: inherit;
        }
        .cell-both .both-char {
            font-size: calc(var(--cell-size) * 0.50);
            font-weight: 900;
            line-height: 1;
            flex-shrink: 0;
        }
        .cell-both .bopo-box.len-1 { font-size: calc(var(--cell-size) * 0.22); }
        .cell-both .bopo-box.len-2 { font-size: calc(var(--cell-size) * 0.20); }
        .cell-both .bopo-box.len-3 { font-size: calc(var(--cell-size) * 0.17); }

        /* 4. 頁碼、數字或標點 */
        .cell-eng-num {
            font-weight: 900;
            color: inherit;
            line-height: 1.1;
            text-align: center;
            white-space: nowrap;
            padding: 0 2px;
        }
        .cell-eng-num.str-short { font-size: calc(var(--cell-size) * 0.42); }
        .cell-eng-num.str-med   { font-size: calc(var(--cell-size) * 0.34); }
        .cell-eng-num.str-long  { font-size: calc(var(--cell-size) * 0.25); }
        .cell-eng-num.str-xlong { font-size: calc(var(--cell-size) * 0.19); }

        .cell-punct {
            font-size: calc(var(--cell-size) * 0.48);
            font-weight: 900;
            color: inherit;
            line-height: 1;
            text-align: center;
        }

        /* --- 底部自助打卡列 --- */
        .attendance-bar-wrapper {
            background: rgba(0,0,0,0.25);
            border-radius: 8px;
            padding: 8px 15px;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
        }
        .attendance-bar {
            display: flex;
            gap: clamp(2px, 0.8vw, 10px);
            justify-content: center;
            align-items: center;
            width: 100%;
            padding-bottom: 8px;
            padding-top: 4px;
        }
        .att-seat {
            flex: 1 1 0px; 
            max-width: 44px; 
            min-width: 15px; 
            aspect-ratio: 1 / 1; 
            height: auto; 
            border-radius: 50%; 
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(0.6rem, 1.8vw, 1.2rem); 
            font-weight: 900;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
            user-select: none;
            position: relative;
        }
        .att-seat:active { transform: scale(0.95); }
        .att-seat.default { background: #ff7675; color: white; border: 2px solid rgba(255,255,255,0.2); }
        .att-seat.leave { background: #7f8c8d; color: #ecf0f1; cursor: not-allowed; opacity: 0.6; }
        .att-seat.on-time { background: #55efc4; color: #1a3c2b; box-shadow: 0 0 10px rgba(85,239,196,0.5); }
        .att-seat.late { background: #ffeaa7; color: #1a3c2b; box-shadow: 0 0 10px rgba(255,234,167,0.5); }
        .att-seat-label { position: absolute; bottom: -18px; font-size: clamp(0.5rem, 1.2vw, 0.75rem); color: #f1c40f; font-weight: bold; white-space: nowrap; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }

        #fullscreen-btn { position: fixed; bottom: 20px; right: 20px; z-index: 100; background: rgba(255,255,255,0.15); color: var(--chalk-white); border-radius: 6px; border: 1px solid rgba(255,255,255,0.3); height: 38px; padding: 0 14px; font-size: 1rem; font-weight: bold; transition: 0.3s; cursor: pointer; backdrop-filter: blur(2px); }
        #fullscreen-btn:hover { background: rgba(255,255,255,0.9); color: #1a3c2b; }
        #loading-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.8); z-index:9999; justify-content:center; align-items:center; color:#333; font-weight:bold; }

        /* 彈出視窗樣式 */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; justify-content: center; align-items: center; backdrop-filter: blur(3px);}
        .modal-content { background: #fff; color: #333; padding: 25px; border-radius: 12px; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.2);}
        .modal-content-large { max-width: 900px; padding: 40px; border-radius: 20px;}
        .seat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(55px, 1fr)); gap: 10px; margin-top: 15px; margin-bottom: 20px;}
        .seat-btn { padding: 10px 5px; border-radius: 8px; border: 2px solid #ecf0f1; background: #f8f9fa; cursor: pointer; font-weight: bold; text-align: center; transition: 0.1s; font-size: 1.1rem; color: #2c3e50;}
        .seat-btn:hover { border-color: #bdc3c7; background: #eaeaec;}
        .seat-btn.leave-selected { background: #e74c3c; color: white; border-color: #c0392b; transform: scale(1.05); box-shadow: 0 4px 10px rgba(231,76,60,0.3);}
        .seat-btn small { display: block; font-size: 0.7em; opacity: 0.9; margin-top: 2px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid #eee; padding-top: 15px;}

        #custom-prompt-modal .modal-content { max-width: 400px; }
        #prompt-input { width: 100%; padding: 12px; margin-top: 15px; border: 2px solid #bdc3c7; border-radius: 8px; font-size: 1.1rem; }

        /* 進階注音編輯器 */
        .ruby-edit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 20px; margin-top: 25px; margin-bottom: 30px;}
        .ruby-edit-card { padding: 20px 12px; border-radius: 16px; border: 2px solid #ecf0f1; background: #f8f9fa; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .ruby-edit-char { font-size: 2.8rem; font-weight: 900; color: #2c3e50; line-height: 1.1; }
        .ruby-edit-input { width: 92%; text-align: center; padding: 10px; border: 3px solid #bdc3c7; border-radius: 10px; color: #e74c3c; font-weight: 900; font-size: 1.6rem;}
        .ruby-mode-select { width: 92%; padding: 6px; border-radius: 8px; border: 2px solid #bdc3c7; font-weight: bold; color: #2c3e50; font-size: 0.95rem; background: #fff; cursor: pointer; }

        /* 假別選擇器 */
        .leave-type-selector { display: flex; gap: 15px; margin: 15px 0; flex-wrap: wrap; background: #f4f6f7; padding: 10px; border-radius: 8px; }
        .leave-type-selector label { cursor: pointer; font-weight: bold; color: #34495e; display: flex; align-items: center; gap: 5px; }
        .leave-type-selector input[type="radio"] { transform: scale(1.2); cursor: pointer; }

        @media (max-width: 900px) {
            #dashboard-screen { padding: 12px; }
            .dashboard-layout { flex-direction: column; gap: 12px; overflow-y: auto; }
            .chalk-panel { width: 100% !important; flex: none !important; min-height: 320px; }
            .resizer { display: none !important; }
        }
    </style>
</head>
<body>

    <div id="loading-overlay">資料同步中...</div>

    <!-- 後台設定畫面 -->
    <div id="setup-screen" class="app-screen active">
        <div class="container">
            <div class="header"><h1>🏫 班級電子看板（三欄直式方格與聲調鎖定版）</h1></div>
            
            <div class="cloud-bar">
                <div class="user-chip">
                    <span class="status-dot" id="cloud-dot"></span>

                <button id="btn-logout" class="btn-secondary" style="display:none; padding:8px 16px;" onclick="doLogout()">登出</button>
            </div>

            <div class="setup-card">
                
                <!-- 全域設定區塊 -->
                <div class="control-group" style="background: #fdfefe; padding: 20px; border-radius: 10px; border: 2px solid #d0ece7; margin-bottom: 25px;">
                    <h3 style="margin-top:0; color:#16a085; border-bottom: 2px solid #d0ece7; padding-bottom: 10px;">⚙️ 班級與方格聯絡簿全域設定</h3>
                    <div style="display:flex; gap:15px; flex-wrap:wrap;">
                        <div style="flex:1; min-width: 120px;">
                            <label>👥 班級總座號</label>
                            <input type="number" id="setting-max-seat" value="35" min="1" max="100">
                        </div>
                        <div style="flex:2; min-width: 200px;">
                            <label>🚫 隱藏或空號（用逗號隔開）</label>
                            <input type="text" id="setting-excluded-seats" placeholder="例如：4, 14">
                        </div>
                        <div style="flex:1; min-width: 120px;">
                            <label>⏰ 遲到判定時間</label>
                            <input type="time" id="setting-late-time" value="07:50">
                        </div>
                    </div>
                    <div style="display:flex; gap:15px; flex-wrap:wrap; margin-top: 15px; align-items:flex-end;">
                        <div style="flex:1; min-width: 140px;">
                            <label>📐 直行方格數量</label>
                            <input type="number" id="setting-grid-rows" value="5" min="3" max="12">
                        </div>
                        <div style="flex:1; min-width: 180px;">
                            <label>🗓️ 學期起始日（統計起點）</label>
                            <input type="date" id="setting-semester-start">
                        </div>
                        <div style="flex:1; min-width: 150px;">
                            <button class="btn-primary" style="background:#f39c12; width:100%; border:none; padding:12px;" onclick="openStatsModal()">📊 檢視學期統計</button>
                        </div>
                    </div>
                    <div style="text-align:right; margin-top:15px;">
                        <button class="btn-primary" style="background:#16a085; border:none;" onclick="saveGlobalSettings()">💾 儲存全域設定</button>
                    </div>
                </div>

                <div class="date-control">
                    <label style="margin:0; font-size:1.1rem; color:#555;">📅 編輯日期：</label>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <button class="nav-btn-setup" onclick="navDate(-1)" title="前一天">◀</button>
                        <input type="date" id="setup-date-picker">
                        <button class="nav-btn-setup" onclick="navDate(1)" title="後一天">▶</button>
                    </div>
                    <span id="save-indicator" class="save-indicator">✓ 已儲存</span>
                </div>

                <div class="control-group" style="display:flex; gap:20px; flex-wrap: wrap;">
                    <div style="flex:1; min-width: 250px;">
                        <label>📝 今日請假名單</label>
                        <div style="display:flex; align-items:center; gap:10px; background: #fff; padding: 6px; border-radius: 8px; border: 2px solid #e0e0e0;">
                            <button id="btn-open-absent" class="btn-secondary" style="padding: 8px 15px;" onclick="openAbsentModal()">選擇座號與假別</button>
                            <span id="setup-absent-display" style="font-weight:bold; color:#e74c3c; flex-grow:1; font-size:1.1rem; padding-left: 5px;">無</span>
                        </div>
                    </div>
                    <div style="flex:1; min-width: 250px;">
                        <label>🧹 值日生</label>
                        <input type="text" id="duty-input" placeholder="例如：林小美">
                    </div>
                </div>

                <hr style="border:0; border-top:1px solid #eee; margin: 25px 0;">

                <!-- 1. 晨間任務設定 -->
                <div class="control-group">
                    <label style="border-left-color: #f39c12;">☀️ 晨間任務（左側・暖陽黃方格）</label>
                    <div class="input-row">
                        <input type="text" id="morning-input" placeholder="例如：訂正國習第十二頁" onkeypress="handleEnter(event, 'morning')">
                        <button onclick="addItem('morning')" class="btn-primary" style="background:#e67e22;">新增</button>
                    </div>
                    <div id="morning-setup-list" class="setup-list"></div>
                </div>

                <!-- 2. 提醒事項設定 -->
                <div class="control-group">
                    <label style="border-left-color: #27ae60;">📢 提醒事項（中間・黑板粉筆方格）</label>
                    <div class="input-row">
                        <input type="text" id="left-input" placeholder="例如：明天穿運動服" onkeypress="handleEnter(event, 'left')">
                        <button onclick="addItem('left')" class="btn-primary" style="background:#27ae60;">新增</button>
                    </div>
                    <div id="left-setup-list" class="setup-list"></div>
                </div>

                <!-- 3. 今日聯絡簿設定 -->
                <div class="control-group">
                    <label style="border-left-color: #2980b9;">📌 今日聯絡簿（右側・白灰紙本方格）</label>
                    <div class="input-row">
                        <input type="text" id="right-input" placeholder="例如：國習第十二、十三頁" onkeypress="handleEnter(event, 'right')">
                        <button onclick="addItem('right')" class="btn-primary">新增</button>
                    </div>
                    <label class="sync-option" title="勾選後，新增的項目會自動傳送到作業繳交系統">
                        <input type="checkbox" id="sync-check" checked> 🔄 同步至作業繳交系統
                    </label>
                    <div id="right-setup-list" class="setup-list"></div>
                </div>

                <div style="margin-top: 35px;">
                    <button id="enter-dashboard-btn" class="btn-primary" style="width:100%; font-size: 1.25em; padding: 15px; background: #27ae60; border: none;">進入黑板模式 ▶</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 請假選擇視窗 -->
    <div id="absent-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="margin-top:0; color:#2c3e50; font-size:1.5rem; border-bottom: 2px solid #eee; padding-bottom: 10px;">請點選請假座號與假別</h3>
            <p style="color:#7f8c8d; font-size:0.9rem; margin-top:5px;">請先選擇下方假別，再點擊對應座號即可標記。</p>
            
            <div class="leave-type-selector">
                <label><input type="radio" name="leave-type" value="事假" checked> 事假</label>
                <label><input type="radio" name="leave-type" value="病假"> 病假</label>
                <label><input type="radio" name="leave-type" value="喪假"> 喪假</label>
                <label><input type="radio" name="leave-type" value="公假"> 公假</label>
                <label style="color: #e74c3c;"><input type="radio" name="leave-type" value="取消"> ❌ 取消請假</label>
            </div>

            <div id="seat-grid" class="seat-grid"></div>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeAbsentModal()">取消</button>
                <button class="btn-primary" style="background:#e74c3c;" onclick="confirmAbsentModal()">確認套用</button>
            </div>
        </div>
    </div>

    <!-- 統計數據視窗 -->
    <div id="stats-modal" class="modal-overlay">
        <div class="modal-content modal-content-large">
            <h3 style="margin-top:0; color:#2c3e50; font-size:1.8rem; border-bottom: 3px solid #eee; padding-bottom: 10px;">📊 學期出缺席統計報表</h3>
            <p style="font-size: 1.1rem; color: #555;">統計區間：<span id="stats-date-range" style="font-weight:bold; color:#2980b9;"></span></p>
            <div style="max-height: 50vh; overflow-y: auto; margin-top: 15px; border: 1px solid #ddd; border-radius: 8px;">
                <table id="stats-table" style="width:100%; border-collapse: collapse; text-align:center; font-size: 1.1rem;">
                    <thead>
                        <tr style="background:#f2f2f2; position:sticky; top:0; z-index: 10;">
                            <th style="padding:12px; border-bottom: 2px solid #ccc;">座號</th>
                            <th style="padding:12px; border-bottom: 2px solid #ccc;">準時（綠）</th>
                            <th style="padding:12px; border-bottom: 2px solid #ccc;">遲到（黃）</th>
                            <th style="padding:12px; border-bottom: 2px solid #ccc;">事假</th>
                            <th style="padding:12px; border-bottom: 2px solid #ccc;">病假</th>
                            <th style="padding:12px; border-bottom: 2px solid #ccc;">喪假</th>
                            <th style="padding:12px; border-bottom: 2px solid #ccc;">公假</th>
                        </tr>

                    <tbody id="stats-tbody"></tbody>
                </table>
            </div>
            <div class="modal-actions" style="margin-top:20px;">
                <button class="btn-secondary" style="padding: 10px 20px; font-size: 1.1rem;" onclick="closeStatsModal()">關閉報表</button>
            </div>
        </div>

    <!-- 進階注音編輯器視窗 -->
    <div id="bpmf-modal" class="modal-overlay">
        <div class="modal-content modal-content-large">
            <h3 style="margin-top:0; color:#2c3e50; font-size:2rem; border-bottom: 3px solid #eee; padding-bottom: 15px; font-weight: 900;">🎯 進階中文注音與單字顯示設定</h3>
            <div id="ruby-grid" class="ruby-edit-grid"></div>
            <div class="modal-actions" style="margin-top: 40px;">
                <button class="btn-secondary" style="font-size: 1.4rem; padding: 12px 25px;" onclick="closeBpmfModal()">取消</button>
                <button class="btn-primary" style="background:#2980b9; font-size: 1.4rem; padding: 12px 25px;" onclick="saveBpmfModal()">完成設定</button>
            </div>
        </div>
    </div>
    
    <!-- 自訂文字輸入視窗 -->

        <div class="modal-content">
            <h3 id="prompt-title" style="margin-top:0; color:#2c3e50; font-size:1.5rem; border-bottom: 2px solid #eee; padding-bottom: 10px;">請修改內容：</h3>

        </div>

    <!-- 黑板主畫面 -->

        <!-- 頂部資訊與工具列 -->
        <div class="top-info-bar">
            <div class="info-left-group">
                <div class="date-navigator">
                    <button class="nav-btn" onclick="navDate(-1)" title="前一天">◀</button>
                    <div class="date-display-group">
                        <div class="date-display" id="date-display">2026年01月01日</div>

                    <button class="nav-btn" onclick="navDate(1)" title="後一天">▶</button>

                <!-- 極簡化值日生標籤 -->
                <div class="top-badge duty-badge" title="今日值日生">

                    <span id="display-duty">無</span>

                <!-- 出缺席狀態摘要 -->

        <!-- 三欄直式方格主區域（可個別收合、可拖曳調整寬度） -->
        <div class="dashboard-layout" id="dashboard-layout">
            
            <!-- 左欄：☀️ 晨間任務 -->

                <div class="panel-header-container">
                    <div class="panel-title-group">
                        <div class="panel-header">☀️ 晨間任務</div>
                    </div>
                    <div class="font-adjust-btns">
                        <button onclick="adjustFont('morning', 0.1)" title="放大晨間任務方格">放大</button>

                        <button class="btn-collapse-panel" onclick="togglePanel('morning')" title="收合晨間任務">收合</button>
                    </div>
                </div>
                <div class="contact-grid-wrapper" id="display-morning-list"></div>
            </div>

            <!-- 分隔拖曳桿 1 -->
            <div class="resizer" id="resizer-1" title="左右拖曳調整寬度"><div class="resizer-line"></div></div>

            <!-- 中欄：📢 提醒事項 -->
            <div class="chalk-panel panel-left" id="panel-left">
                <div class="panel-header-container">
                    <div class="panel-title-group">
                        <div class="panel-header">📢 提醒事項</div>
                    </div>
                    <div class="font-adjust-btns">
                        <button onclick="adjustFont('left', 0.1)" title="放大提醒事項方格">放大</button>
                        <button onclick="adjustFont('left', -0.1)" title="縮小提醒事項方格">縮小</button>
                        <button class="btn-collapse-panel" onclick="togglePanel('left')" title="收合提醒事項">收合</button>
                    </div>

        /* 判斷是否為注音符號或聲調符號 */
        function isBopomofoChar(char) {
            if (!char) return false;
            const code = char.charCodeAt(0);
            return (code >= 0x3100 && code <= 0x312F) || (code >= 0x31A0 && code <= 0x31BA) || ['ˊ','ˇ','ˋ','˙'].includes(char);
        }

        /* 拆解文字為單格物件：連續英數字自動合併為一格，半形空白作為分隔符不佔格 */
        function generateRubyData(text) {
            let result = [];
            const regex = /([a-zA-Z0-9.~_-]+)|(.)/g;
            let match;

            while ((match = regex.exec(text)) !== null) {
                if (match[1]) {
                    result.push({ char: match[1], bpmf: '', type: 'eng-num' });
                } else if (match[2]) {
                    const char = match[2];
                    if (char === ' ') continue;
                    if (char === '　') {
                        result.push({ char: '', bpmf: '', type: 'punct' });
                        continue;
                    }
                    
                    if (isBopomofoChar(char)) {
                        let combinedBpmf = char;
                        while (regex.lastIndex < text.length) {
                            const nextChar = text[regex.lastIndex];
                            if (['ˊ','ˇ','ˋ','˙'].includes(nextChar)) {
                                combinedBpmf += nextChar;
                                regex.lastIndex++;
                            } else {
                                break;
                            }
                        }
                        result.push({ char: combinedBpmf, bpmf: combinedBpmf, type: 'char', isBopomofoOnly: true });
                        continue;
                    }
                    
                    if (/[，。！？、；：()（）《》「」【】]/.test(char)) {
                        result.push({ char: char, bpmf: '', type: 'punct' });
                    } else {
                        try {
                            let pyRes = window.pinyinPro.pinyin(char, { type: 'array', toneType: 'num' });
                            if (!pyRes || pyRes.length === 0) {
                                result.push({ char: char, bpmf: '', type: 'char' });
                                continue;
                            }
                            let pyStr = pyRes[0];
                            let m = pyStr.toLowerCase().match(/([a-züv]+)(\d)?/);
                            if (!m) {
                                result.push({ char: char, bpmf: '', type: 'char' });
                                continue;
                            }
                            let py = m[1].replace('ü', 'v');
                            let tone = m[2] || '1';
                            let bpmf = py2bpmf[py] || '';
                            
                            if (!bpmf) {
                                result.push({ char: char, bpmf: '', type: 'char' });
                                continue;
                            }
                            if (tone === '2') bpmf += 'ˊ';
                            else if (tone === '3') bpmf += 'ˇ';
                            else if (tone === '4') bpmf += 'ˋ';
                            else if (tone === '0') bpmf = '˙' + bpmf;
                            result.push({ char: char, bpmf: bpmf, type: 'char' });
                        } catch(e) {
                            result.push({ char: char, bpmf: '', type: 'char' });
                        }
                    }
                }
            }
            return result;
        }

        function upgradeDataStructure(list) {
            if (!list) return [];
            return list.map(item => {
                if (typeof item === 'string') return { rawText: item, rubyData: generateRubyData(item) };
                else if (item && typeof item === 'object') {
                    if (!item.rubyData) {
                        item.rubyData = generateRubyData(item.rawText || "");
                    } else {
                        item.rubyData = item.rubyData.filter(rObj => !(rObj.type === 'punct' && rObj.char === ' '));
                        item.rubyData.forEach(rObj => {
                            if (rObj.type === 'char' && isBopomofoChar(rObj.char) && !rObj.hasOwnProperty('isBopomofoOnly')) {
                                rObj.isBopomofoOnly = true;
                            }
                        });
                    }
                    return item;
                }
                return { rawText: '', rubyData: [] };
            });
        }

        /* 👑 教育部標準直式注音生成器：聲調精準鎖定在最後一個注音符號右側 👑 */
        function buildVerticalBopoHTML(bpmfStr) {
            if (!bpmfStr) return '';
            let sym = bpmfStr.trim();
            let tone = '';
            let isLight = false;

            if (sym.startsWith('˙')) {
                isLight = true;
                sym = sym.substring(1);
                tone = '˙';
            } else if (sym.endsWith('˙')) {
                isLight = true;
                sym = sym.slice(0, -1);
                tone = '˙';
            } else {
                const last = sym.slice(-1);
                if (['ˊ', 'ˇ', 'ˋ'].includes(last)) {
                    tone = last;
                    sym = sym.slice(0, -1);
                }
            }

            const chars = sym.split('');
            const lenClass = `len-${Math.min(3, Math.max(1, chars.length))}`;
            const sideToneClass = (tone && !isLight) ? 'with-side-tone' : '';

            let symHtml = '';
            chars.forEach((c, idx) => {
                const isLast = (idx === chars.length - 1);
                const sideToneSpan = (isLast && tone && !isLight) ? `<span class="tone-side-mark">${tone}</span>` : '';
                symHtml += `<span class="sym-char">${c}${sideToneSpan}</span>`;
            });

            return `<span class="bopo-box ${lenClass} ${sideToneClass}">
                ${isLight ? `<span class="tone-light-mark">˙</span>` : ''}
                ${symHtml}
            </span>`;
        }

            const stored = localStorage.getItem(LOCAL_KEY);
            if(stored) allLocalData = JSON.parse(stored);
            
            const localSettings = localStorage.getItem(GLOBAL_SETTING_KEY);
            if(localSettings) globalSettings = {...globalSettings, ...JSON.parse(localSettings)};
            if (!globalSettings.semesterStartDate) {
                globalSettings.semesterStartDate = currentDateStr;
            }
            if (!globalSettings.gridRows || globalSettings.gridRows < 3) {
                globalSettings.gridRows = 5;
            }

            if (typeof firebase !== 'undefined') {
                try {
                    if (!firebase.apps.length) firebase.initializeApp(userFirebaseConfig);
                    auth = firebase.auth();
                    db = firebase.firestore();
                    auth.onAuthStateChanged((u) => {
                        if (u) { user = u; handleLoginSuccess(u); }
                        else { user = null; handleLogoutSuccess(); }
                    });
                } catch(e) { console.error(e); }
            } else {
                renderGlobalSettingsUI();
                loadDataForDate(currentDateStr);
            }
        }

        function handleLoginSuccess(u) {
            isCloud = true;
            els.cloudStatus.textContent = `已連線：${u.displayName}`;
            els.cloudStatus.style.color = '#2ecc71';
            els.cloudDot.classList.add('online');
            els.btnLogin.style.display = 'none';
            els.btnLogout.style.display = 'block';
            
            db.collection('users').doc(u.uid).collection('settings_low').doc('global').get().then(doc => {
                if(doc.exists) {
                    globalSettings = {...globalSettings, ...doc.data()};
                    if (!globalSettings.gridRows) globalSettings.gridRows = 5;
                }
                renderGlobalSettingsUI();
                loadDataForDate(currentDateStr);
            });
        }

        function handleLogoutSuccess() {
            isCloud = false;
            if(unsubscribe) unsubscribe();
            els.cloudStatus.textContent = "單機模式";
            els.cloudStatus.style.color = '#555';
            els.cloudDot.classList.remove('online');
            els.btnLogin.style.display = 'block';
            els.btnLogout.style.display = 'none';
            renderGlobalSettingsUI();
            loadDataForDate(currentDateStr);
        }

            document.getElementById('setting-max-seat').value = globalSettings.maxSeat;
            document.getElementById('setting-excluded-seats').value = globalSettings.excludedSeats.join(', ');
            document.getElementById('setting-late-time').value = globalSettings.lateTime;
            document.getElementById('setting-semester-start').value = globalSettings.semesterStartDate;

        window.saveGlobalSettings = function() {
            globalSettings.maxSeat = parseInt(document.getElementById('setting-max-seat').value) || 35;
            let exclStr = document.getElementById('setting-excluded-seats').value;
            globalSettings.excludedSeats = exclStr.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n));
            globalSettings.lateTime = document.getElementById('setting-late-time').value || "07:50";
            globalSettings.semesterStartDate = document.getElementById('setting-semester-start').value;
            globalSettings.gridRows = Math.max(3, Math.min(12, parseInt(document.getElementById('setting-grid-rows').value) || 5));

            if(isCloud && user) {
                db.collection('users').doc(user.uid).collection('settings_low').doc('global').set(globalSettings)
                  .then(() => showSaving("全域設定已儲存至雲端！"));

                showSaving("全域設定已本機儲存！");

            renderDashboardUI(); 
        }

        /* 在黑板上方直接調整直行格數 */
        window.adjustGridRows = function(delta) {
            const currentRows = globalSettings.gridRows || 5;
            const nextRows = Math.max(3, Math.min(12, currentRows + delta));
            if (nextRows === currentRows) return;
            globalSettings.gridRows = nextRows;
            localStorage.setItem(GLOBAL_SETTING_KEY, JSON.stringify(globalSettings));
            if (isCloud && user) {
                db.collection('users').doc(user.uid).collection('settings_low').doc('global').set(globalSettings);
            }
            renderGlobalSettingsUI();
            renderDashboardUI();
        };

        function loadDataForDate(date) {
            currentDateStr = date;
            els.setupDatePicker.value = date;
            currentData = { morningList: [], leftList: [], rightList: [], absentText: "", dutyText: "", leaves: {}, checkins: {} };

            const processData = (data) => {
                currentData.morningList = upgradeDataStructure(data.morningList);
                currentData.leftList = upgradeDataStructure(data.leftList);
                currentData.rightList = upgradeDataStructure(data.rightList);
                currentData.dutyText = data.dutyText || "";
                currentData.absentText = data.absentText || "";
                currentData.leaves = data.leaves || {};
                currentData.checkins = data.checkins || {};
                
                if (data.absentSeats && data.absentSeats.length > 0 && Object.keys(currentData.leaves).length === 0) {
                    data.absentSeats.forEach(seat => currentData.leaves[seat] = '事假');
                }
            };

            if(isCloud && user) {
                if(unsubscribe) unsubscribe();
                const docRef = db.collection('users').doc(user.uid).collection('board_records_low').doc(date);
                els.loading.style.display = 'flex';
                unsubscribe = docRef.onSnapshot(doc => {
                    if(doc.exists) processData(doc.data());
                    renderSetupUI(); renderDashboardUI();
                    els.loading.style.display = 'none';
                });
            } else {
                if(allLocalData[date]) processData(allLocalData[date]);
                renderSetupUI(); renderDashboardUI();
            }
        }

            showSaving();
            if(isCloud && user) {
                db.collection('users').doc(user.uid).collection('board_records_low').doc(currentDateStr).set(currentData);
            } else {
                allLocalData[currentDateStr] = currentData;

        function renderSeatGrid() {
            els.seatGrid.innerHTML = '';

            let selectedType = selectedTypeNode ? selectedTypeNode.value : '事假';
            
            for(let i = 1; i <= globalSettings.maxSeat; i++) {

                btn.className = `seat-btn ${isLeave ? 'leave-selected' : ''}`;

                        if(currentData.checkins && currentData.checkins[i]) delete currentData.checkins[i];
                    }

        }

        function renderAttendanceBar() {
            els.attendanceBar.innerHTML = '';
            let totalSeats = 0;
            let onTimeCount = 0; let lateCount = 0; let leaveCount = 0;

            for(let i = 1; i <= globalSettings.maxSeat; i++) {
                if(globalSettings.excludedSeats.includes(i)) continue;
                totalSeats++;

                const seatDiv = document.createElement('div');
                seatDiv.className = 'att-seat';
                let statusClass = 'default';
                let extraLabel = '';

                if (currentData.leaves && currentData.leaves[i]) {
                    statusClass = 'leave';
                    extraLabel = `<span class="att-seat-label" style="color:#bdc3c7;">${currentData.leaves[i]}</span>`;
                    leaveCount++;
                } else if (currentData.checkins && currentData.checkins[i]) {
                    statusClass = currentData.checkins[i];
                    if (statusClass === 'on-time') onTimeCount++;
                    if (statusClass === 'late') lateCount++;
                }

                seatDiv.classList.add(statusClass);
                seatDiv.innerHTML = `${i} ${extraLabel}`;

                seatDiv.onclick = () => handleCheckIn(i);
                seatDiv.ondblclick = () => handleCancelCheckIn(i);

                els.attendanceBar.appendChild(seatDiv);
            }
            
            let notArrived = totalSeats - onTimeCount - lateCount - leaveCount;
            let summaryText = "";
            if (leaveCount > 0) summaryText += `請假:${leaveCount}人 `;
            if (lateCount > 0) summaryText += `遲到:${lateCount}人 `;
            if (notArrived > 0) summaryText += `未到:${notArrived}人 `;
            
            if(summaryText === "") {
                els.displayAbsent.textContent = "全勤";
                els.displayAbsent.style.color = 'rgba(255,255,255,0.6)';
            } else {
                els.displayAbsent.textContent = summaryText;
                els.displayAbsent.style.color = '#ff7675';
            }
        }

        function handleCheckIn(seatNum) {
            if (currentData.leaves && currentData.leaves[seatNum]) return; 
            if (currentData.checkins && currentData.checkins[seatNum]) return; 

            let now = new Date();
            let timeStr = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
            let status = (timeStr <= globalSettings.lateTime) ? 'on-time' : 'late';
            
            if (!currentData.checkins) currentData.checkins = {};
            currentData.checkins[seatNum] = status;
            
            saveData();
        }

        function handleCancelCheckIn(seatNum) {
            if (currentData.leaves && currentData.leaves[seatNum]) return; 
            if (currentData.checkins && currentData.checkins[seatNum]) {
                delete currentData.checkins[seatNum];
                saveData();
            }
        }

        window.openStatsModal = async function() {
            document.getElementById('stats-modal').style.display = 'flex';
            document.getElementById('stats-date-range').textContent = `${globalSettings.semesterStartDate} ～ 至今`;
            const tbody = document.getElementById('stats-tbody');
            tbody.innerHTML = '<tr><td colspan="7">資料計算中，請稍候...</td></tr>';

            let stats = {};
            for(let i=1; i<=globalSettings.maxSeat; i++) {
                if(!globalSettings.excludedSeats.includes(i)) {
                    stats[i] = { onTime:0, late:0, shijia:0, bingjia:0, sangjia:0, gongjia:0 };
                }
            }

            let records = {};
            if (isCloud && user) {
                const snapshot = await db.collection('users').doc(user.uid).collection('board_records_low').get();
                snapshot.forEach(doc => { records[doc.id] = doc.data(); });
            } else {
                records = allLocalData;
            }

            const todayStr = new Date().toISOString().slice(0,10);
            for (const [date, data] of Object.entries(records)) {
                if (date >= globalSettings.semesterStartDate && date <= todayStr) {
                    if(data.checkins) {
                        for(const [seat, status] of Object.entries(data.checkins)) {
                            if(stats[seat]) {
                                if(status === 'on-time') stats[seat].onTime++;
                                if(status === 'late') stats[seat].late++;
                            }
                        }
                    }
                    let leaves = data.leaves || {};
                    if(data.absentSeats && data.absentSeats.length > 0 && Object.keys(leaves).length===0) {
                        data.absentSeats.forEach(s => leaves[s] = '事假');
                    }
                    for(const [seat, type] of Object.entries(leaves)) {
                        if(stats[seat]) {
                            if(type === '事假') stats[seat].shijia++;
                            else if(type === '病假') stats[seat].bingjia++;
                            else if(type === '喪假') stats[seat].sangjia++;
                            else if(type === '公假') stats[seat].gongjia++;
                        }
                    }
                }
            }

            tbody.innerHTML = '';
            const fmt = (val, highlightColor) => {
                if (val > 0) return `<span style="color:${highlightColor}; font-weight:900; font-size:1.2em;">${val}</span>`;
                return `<span style="color:#bdc3c7; font-weight:normal;">0</span>`;
            };

            for(let i=1; i<=globalSettings.maxSeat; i++) {
                if(globalSettings.excludedSeats.includes(i)) continue;
                let s = stats[i];
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="font-weight:900; color:#2c3e50; font-size:1.2em;">${i}</td>
                    <td>${fmt(s.onTime, '#27ae60')}</td>
                    <td>${fmt(s.late, '#f39c12')}</td>
                    <td>${fmt(s.shijia, '#e74c3c')}</td>
                    <td>${fmt(s.bingjia, '#e74c3c')}</td>
                    <td>${fmt(s.sangjia, '#e74c3c')}</td>
                    <td>${fmt(s.gongjia, '#8e44ad')}</td>
                `;
                tbody.appendChild(tr);
            }
        }

        /* 👑 共用直式方格渲染引擎（由右至左、一字一格、奇偶底色交錯、滿格自動同色折行） 👑 */
        function renderVerticalGrid(container, list, side, themeClass, emptyMsg, minEmptyCols) {
            container.innerHTML = '';
            const rowsPerCol = Math.max(3, Math.min(12, parseInt(globalSettings.gridRows) || 5));

            if (!list || list.length === 0) {
                container.innerHTML = `<div style="opacity:0.55; font-size:1.5rem; margin:auto; font-weight:bold;">${emptyMsg}</div>`;
                return;
            }

            const board = document.createElement('div');
            board.className = `contact-grid-board ${themeClass}`;

            let totalColsRendered = 0;

            list.forEach((item, itemIdx) => {
                const isOddItem = (itemIdx % 2 === 0);
                const bgClass = isOddItem ? 'item-odd' : 'item-even';
                const tokens = (item.rubyData || []).map((rObj, tokenIdx) => ({ rObj, tokenIdx }));

                const chunks = [];
                if (tokens.length === 0) {
                    chunks.push([]);
                } else {
                    for (let i = 0; i < tokens.length; i += rowsPerCol) {
                        chunks.push(tokens.slice(i, i + rowsPerCol));
                    }
                }

                chunks.forEach((chunk, chunkIdx) => {
                    totalColsRendered++;
                    const colDiv = document.createElement('div');
                    colDiv.className = `grid-col ${bgClass}`;

                    // 1. 頂部第一大格：項次格
                    const headerCell = document.createElement('div');
                    headerCell.className = 'grid-cell header-cell';
                    if (chunkIdx === 0) {
                        headerCell.classList.add('has-num');
                        headerCell.textContent = itemIdx + 1;
                        headerCell.title = '點擊朗讀此項目';
                        headerCell.onclick = () => speakText(item.rawText);
                    }
                    colDiv.appendChild(headerCell);

                    // 2. 下方內容格
                    for (let r = 0; r < rowsPerCol; r++) {
                        const cell = document.createElement('div');
                        cell.className = 'grid-cell';

                        if (r < chunk.length) {
                            const { rObj, tokenIdx } = chunk[r];
                            populateGridCell(cell, rObj, side, itemIdx, tokenIdx);
                        }
                        colDiv.appendChild(cell);
                    }

                    board.appendChild(colDiv);
                });
            });

            // 預留至少 1 欄空白預備欄
            const minCols = Math.max(minEmptyCols || 3, totalColsRendered + 1);
            const nextIsOdd = (list.length % 2 === 0);
            for (let c = totalColsRendered; c < minCols; c++) {
                const emptyCol = document.createElement('div');
                const emptyBg = ((c - totalColsRendered) % 2 === 0)
                    ? (nextIsOdd ? 'item-odd' : 'item-even')
                    : (nextIsOdd ? 'item-even' : 'item-odd');
                emptyCol.className = `grid-col ${emptyBg}`;

                const emptyHeader = document.createElement('div');
                emptyHeader.className = 'grid-cell header-cell';
                emptyCol.appendChild(emptyHeader);

                for (let r = 0; r < rowsPerCol; r++) {
                    const emptyCell = document.createElement('div');
                    emptyCell.className = 'grid-cell';
                    emptyCol.appendChild(emptyCell);
                }
                board.appendChild(emptyCol);
            }

            container.appendChild(board);
        }

        /* 填入單一方格內容，並綁定單格三態循環切換（國字＋注音 ➔ 純國字 ➔ 純注音） */
        function populateGridCell(cell, rObj, side, itemIdx, tokenIdx) {
            if (rObj.type === 'eng-num') {
                const str = rObj.char || '';
                let sizeClass = 'str-short';
                if (str.length >= 7) sizeClass = 'str-xlong';
                else if (str.length >= 5) sizeClass = 'str-long';
                else if (str.length >= 3) sizeClass = 'str-med';

                cell.innerHTML = `<span class="cell-eng-num ${sizeClass}">${str}</span>`;
                return;
            }

            if (rObj.type === 'punct') {
                cell.innerHTML = `<span class="cell-punct">${rObj.char || ''}</span>`;
                return;
            }

            if (rObj.type === 'char') {
                if (rObj.isBopomofoOnly) {
                    cell.innerHTML = `<div class="cell-bpmf-only">${buildVerticalBopoHTML(rObj.bpmf || rObj.char)}</div>`;
                    return;
                }

                // 0: 國字＋注音, 1: 純國字, 2: 純注音
                const effectiveMode = (rObj.cellMode !== undefined && rObj.cellMode !== null)
                    ? rObj.cellMode
                    : displayMode;

                if (!rObj.bpmf || effectiveMode === 1) {
                    cell.innerHTML = `<div class="cell-char-only">${rObj.char}</div>`;
                } else if (effectiveMode === 2) {
                    cell.innerHTML = `<div class="cell-bpmf-only">${buildVerticalBopoHTML(rObj.bpmf)}</div>`;
                } else {
                    cell.innerHTML = `<div class="cell-both">
                        <span class="both-char">${rObj.char}</span>
                        ${buildVerticalBopoHTML(rObj.bpmf)}
                    </div>`;
                }

                cell.classList.add('interactive-cell');
                cell.title = '點擊切換此格：國字＋注音 ／ 純國字 ／ 純注音';
                cell.onclick = (e) => {
                    e.stopPropagation();
                    toggleSingleCellMode(side, itemIdx, tokenIdx);
                };
            }
        }

        function toggleSingleCellMode(side, itemIdx, tokenIdx) {
            const list = getListBySide(side);
            const item = list[itemIdx];
            if (!item || !item.rubyData || !item.rubyData[tokenIdx]) return;
            const rObj = item.rubyData[tokenIdx];
            const current = (rObj.cellMode !== undefined && rObj.cellMode !== null) ? rObj.cellMode : displayMode;
            rObj.cellMode = (current + 1) % 3;
            saveData();
        }

        window.addItem = function(side) {
            const input = document.getElementById(side + '-input');
            const val = input.value.trim();
            if(val) {
                const newItem = { rawText: val, rubyData: generateRubyData(val) };
                if(side === 'morning') {
                    if(!currentData.morningList) currentData.morningList = [];
                    currentData.morningList.push(newItem);
                } else if(side === 'left') {
                    if(!currentData.leftList) currentData.leftList = [];
                    currentData.leftList.push(newItem);
                } else {
                    if(!currentData.rightList) currentData.rightList = [];
                    currentData.rightList.push(newItem);
                    
                    const syncCheck = document.getElementById('sync-check');
                    if (syncCheck && syncCheck.checked) {
                        const newAssign = {
                            id: `assign_${currentDateStr}_${Date.now()}`,
                            name: val,
                            records: {}
                        };
                        
                        if (isCloud && user) {
                            db.collection('users').doc(user.uid).collection('daily_records_low').doc(currentDateStr)
                              .set({ assignments: firebase.firestore.FieldValue.arrayUnion(newAssign) }, { merge: true })
                              .then(() => showSaving("✓ 聯絡簿已同步至作業系統"))
                              .catch(err => console.error("同步失敗", err));
                        } else {
                            const LOCAL_HW_KEY = 'homework_tracker_low_data';
                            let hwData = {};
                            try { hwData = JSON.parse(localStorage.getItem(LOCAL_HW_KEY)) || {}; } catch(e){}
                            if(!hwData[currentDateStr]) hwData[currentDateStr] = [];
                            hwData[currentDateStr].push(newAssign);
                            localStorage.setItem(LOCAL_HW_KEY, JSON.stringify(hwData));
                            showSaving("✓ 已本機同步至作業系統");
                        }
                    }
                }
                input.value = ''; saveData(); renderSetupUI(); input.focus();
            }
        }
        
        window.removeItem = function(side, idx) {

            list.splice(idx, 1);
