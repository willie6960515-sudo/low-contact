        window.editItemText = function(side, idx) {
            const list = getListBySide(side);
            els.promptInput.value = list[idx].rawText;
            els.promptModal.style.display = 'flex';
            els.promptInput.focus();

            promptCallback = function(newVal) {
                if (newVal !== null && newVal.trim() !== '') {
                    list[idx].rawText = newVal.trim(); 
                    list[idx].rubyData = generateRubyData(newVal.trim());
                    saveData(); renderSetupUI();
                }
            };
        }

        window.closePromptModal = function() {
            els.promptModal.style.display = 'none';
            promptCallback = null;
        }

        window.confirmPromptModal = function() {
            if (promptCallback) {
                promptCallback(els.promptInput.value);
            }
            closePromptModal();
        }

        els.promptInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                confirmPromptModal();
            }
        });

        window.handleEnter = function(e, side) { if(e.key === 'Enter') window.addItem(side); }
        window.navDate = function(delta) {
            const d = new Date(currentDateStr); d.setDate(d.getDate() + delta);
            const offset = d.getTimezoneOffset() * 60000;
            loadDataForDate((new Date(d - offset)).toISOString().slice(0, 10));
        }
        els.setupDatePicker.addEventListener('change', (e) => loadDataForDate(e.target.value));
        document.getElementById('duty-input').addEventListener('change', () => { currentData.dutyText = document.getElementById('duty-input').value; saveData(); });

        window.doLogin = function() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => console.error(e.message)); }
        window.doLogout = function() { auth.signOut(); }

        function showSaving(msg = "✓ 已儲存") { els.saveIndicator.textContent = msg; els.saveIndicator.classList.add('show'); setTimeout(() => els.saveIndicator.classList.remove('show'), 2000); }

        document.getElementById('enter-dashboard-btn').addEventListener('click', () => { els.setupScreen.classList.remove('active'); els.dashboardScreen.classList.add('active'); if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{}); });
        document.getElementById('discrete-setup-btn').addEventListener('click', () => { els.dashboardScreen.classList.remove('active'); els.setupScreen.classList.add('active'); if (document.exitFullscreen && document.fullscreenElement) document.exitFullscreen().catch(()=>{}); });
        document.getElementById('fullscreen-btn').addEventListener('click', () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else if (document.exitFullscreen) document.exitFullscreen(); });

        function updateClock() {
            const now = new Date();
            const m = now.getMinutes().toString().padStart(2,'0');
            const ampm = now.getHours() >= 12 ? '下午' : '上午';
            const h12 = now.getHours() % 12 || 12;
            if (els.digitalClock) els.digitalClock.textContent = `${ampm} ${h12.toString().padStart(2,'0')}:${m}`;
        }

        // --- 三欄獨立方格縮放控制 ---
        function applyFontScales() {
            document.documentElement.style.setProperty('--morning-scale', panelState.morning.scale);
            document.documentElement.style.setProperty('--left-scale', panelState.left.scale);
            document.documentElement.style.setProperty('--right-scale', panelState.right.scale);
        }

        window.adjustFont = function(side, delta) {
            if (!panelState[side]) return;
            panelState[side].scale = Math.max(0.6, Math.min(2.2, Math.round((panelState[side].scale + delta) * 10) / 10));
            savePanelState();
            applyFontScales();
        };

        // --- 三欄展開／收合與動態拖曳寬度配置 ---
        window.togglePanel = function(side) {
            if (!panelState[side]) return;
            const visibleCount = ['morning', 'left', 'right'].filter(k => panelState[k].visible).length;
            // 若只剩最後一個區塊開啟，避免全部關閉造成畫面空白
            if (panelState[side].visible && visibleCount <= 1) {
                return;
            }
            panelState[side].visible = !panelState[side].visible;
            savePanelState();
            applyPanelLayout();
        };

        function applyPanelLayout() {
            const mVis = panelState.morning.visible;
            const lVis = panelState.left.visible;
            const rVis = panelState.right.visible;

            els.panelMorning.classList.toggle('is-collapsed', !mVis);
            els.panelLeft.classList.toggle('is-collapsed', !lVis);
            els.panelRight.classList.toggle('is-collapsed', !rVis);

            els.panelMorning.style.flex = `${panelState.morning.weight} 1 0px`;
            els.panelLeft.style.flex    = `${panelState.left.weight} 1 0px`;
            els.panelRight.style.flex   = `${panelState.right.weight} 1 0px`;

            // 控制頂部開關按鈕的視覺狀態
            const btnM = document.getElementById('toggle-panel-morning');
            const btnL = document.getElementById('toggle-panel-left');
            const btnR = document.getElementById('toggle-panel-right');
            if (btnM) { btnM.classList.toggle('active-morning', mVis); btnM.classList.toggle('collapsed', !mVis); }
            if (btnL) { btnL.classList.toggle('active-left', lVis);    btnL.classList.toggle('collapsed', !lVis); }
            if (btnR) { btnR.classList.toggle('active-right', rVis);   btnR.classList.toggle('collapsed', !rVis); }

            // 決定兩根拖曳分隔桿是否顯示
            // resizer-1 位於 morning 與 (left 或 right) 之間
            const showR1 = mVis && (lVis || rVis);
            // resizer-2 位於 left 與 right 之間
            const showR2 = lVis && rVis;

            els.resizer1.classList.toggle('is-hidden', !showR1);
            els.resizer2.classList.toggle('is-hidden', !showR2);
        }

        function initResizers() {
            let activeResizer = null;
            let startX = 0;
            let leftKey = null;
            let rightKey = null;
            let startLeftWidth = 0;
            let startRightWidth = 0;
            let combinedWeight = 0;

            const startDrag = (resizerNum, clientX) => {
                if (resizerNum === 1) {
                    leftKey = 'morning';
                    rightKey = panelState.left.visible ? 'left' : 'right';
                    els.resizer1.classList.add('dragging');
                } else {
                    leftKey = 'left';
                    rightKey = 'right';
                    els.resizer2.classList.add('dragging');
                }
                const leftEl = document.getElementById('panel-' + leftKey);
                const rightEl = document.getElementById('panel-' + rightKey);
                if (!leftEl || !rightEl) return;

                activeResizer = resizerNum;
                startX = clientX;
                startLeftWidth = leftEl.getBoundingClientRect().width;
                startRightWidth = rightEl.getBoundingClientRect().width;
                combinedWeight = panelState[leftKey].weight + panelState[rightKey].weight;
                document.body.style.cursor = 'col-resize';
            };

            const doDrag = (clientX) => {
                if (!activeResizer || !leftKey || !rightKey) return;
                const totalPx = startLeftWidth + startRightWidth;
                if (totalPx <= 0) return;

                const deltaX = clientX - startX;
                const minPx = 160;
                const newLeftPx = Math.max(minPx, Math.min(totalPx - minPx, startLeftWidth + deltaX));
                const leftRatio = newLeftPx / totalPx;

                panelState[leftKey].weight = Math.round(combinedWeight * leftRatio * 10) / 10;
                panelState[rightKey].weight = Math.round((combinedWeight - panelState[leftKey].weight) * 10) / 10;

                applyPanelLayout();
            };

            const stopDrag = () => {
                if (activeResizer) {
                    activeResizer = null;
                    els.resizer1.classList.remove('dragging');
                    els.resizer2.classList.remove('dragging');
                    document.body.style.cursor = '';
                    savePanelState();
                }
            };

            els.resizer1.addEventListener('mousedown', (e) => startDrag(1, e.clientX));
            els.resizer2.addEventListener('mousedown', (e) => startDrag(2, e.clientX));
            els.resizer1.addEventListener('touchstart', (e) => startDrag(1, e.touches[0].clientX), {passive: true});
            els.resizer2.addEventListener('touchstart', (e) => startDrag(2, e.touches[0].clientX), {passive: true});

            document.addEventListener('mousemove', (e) => doDrag(e.clientX));
            document.addEventListener('touchmove', (e) => { if (activeResizer) doDrag(e.touches[0].clientX); }, {passive: true});
            document.addEventListener('mouseup', stopDrag);
            document.addEventListener('touchend', stopDrag);
        }

        function applyDisplayMode() {
            if (els.toggleDisplayBtn) {
                els.toggleDisplayBtn.textContent = `👁️ ${modeNames[displayMode]}`;
            }
        }

        /* 點擊上方整體顯示模式時，一鍵切換全體狀態並將三區所有單格對齊至該模式 */
        document.getElementById('toggle-display-btn').addEventListener('click', () => {
            displayMode = (displayMode + 1) % 3;
            localStorage.setItem('board_display_mode_low', displayMode.toString());
            ['morningList', 'leftList', 'rightList'].forEach(listKey => {
                if (currentData[listKey]) {
                    currentData[listKey].forEach(item => {
                        (item.rubyData || []).forEach(rObj => {
                            delete rObj.cellMode;
                        });
                    });
                }
            });
            applyDisplayMode();
            saveData();
        });

        /* 進階注音編輯器（支援修改破音字注音與單字預設顯示模式） */
        window.openBpmfEditor = function(side, idx) {
            editingSide = side; editingIndex = idx;
            const list = getListBySide(side);
            const item = list[idx];
            const grid = document.getElementById('ruby-grid');
            grid.innerHTML = '';
            item.rubyData.forEach((rObj, i) => {
                if (rObj.type !== 'char') return; 
                const currentCellMode = (rObj.cellMode !== undefined && rObj.cellMode !== null) ? rObj.cellMode.toString() : 'auto';
                const card = document.createElement('div');
                card.className = 'ruby-edit-card';
                card.innerHTML = `
                    <div class="ruby-edit-char">${rObj.char}</div>
                    <input type="text" class="ruby-edit-input" id="edit-bpmf-${i}" value="${rObj.bpmf}" placeholder="空白">
                    ${!rObj.isBopomofoOnly ? `
                    <select class="ruby-mode-select" id="edit-mode-${i}">
                        <option value="auto" ${currentCellMode === 'auto' ? 'selected' : ''}>跟隨全體模式</option>
                        <option value="0" ${currentCellMode === '0' ? 'selected' : ''}>國字＋注音</option>
                        <option value="1" ${currentCellMode === '1' ? 'selected' : ''}>純國字</option>
                        <option value="2" ${currentCellMode === '2' ? 'selected' : ''}>純注音</option>
                    </select>` : ''}
                `;
                grid.appendChild(card);
            });
            document.getElementById('bpmf-modal').style.display = 'flex';
        }
        window.closeBpmfModal = function() { document.getElementById('bpmf-modal').style.display = 'none'; }
        window.saveBpmfModal = function() {
            const list = getListBySide(editingSide);
            const item = list[editingIndex];
            item.rubyData.forEach((rObj, i) => {
                const input = document.getElementById(`edit-bpmf-${i}`);
                if (input) rObj.bpmf = input.value.trim();
                const modeSelect = document.getElementById(`edit-mode-${i}`);
                if (modeSelect) {
                    if (modeSelect.value === 'auto') delete rObj.cellMode;
                    else rObj.cellMode = parseInt(modeSelect.value);
                }
            });
            closeBpmfModal(); saveData(); renderDashboardUI();
        }
    </script>
</body>
</html>
